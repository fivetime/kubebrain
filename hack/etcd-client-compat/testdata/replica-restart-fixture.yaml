apiVersion: v1
kind: Service
metadata:
  name: a3524-idle-restart-peer
  namespace: kubebrain-dev
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: a3524-idle-restart
  ports:
    - name: peer
      port: 3380
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: a3524-idle-restart
  namespace: kubebrain-dev
spec:
  type: NodePort
  selector:
    app: a3524-idle-restart
  ports:
    - name: client
      port: 3379
      targetPort: client
      nodePort: 30479
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: a3524-idle-restart
  namespace: kubebrain-dev
spec:
  serviceName: a3524-idle-restart-peer
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: a3524-idle-restart
  template:
    metadata:
      labels:
        app: a3524-idle-restart
    spec:
      containers:
        - name: kubebrain
          image: kubebrain:a3524-empty-revision
          imagePullPolicy: IfNotPresent
          args:
            - --advertise-host=$(POD_NAME).a3524-idle-restart-peer.kubebrain-dev.svc.cluster.local
            - --compatible-with-etcd=true
            - --count-index-max-keys=5000000
            - --enable-count-index=true
            - --enable-storage-metrics=true
            - --info-port=8080
            - --initial-cluster=a3524-idle-restart-0=http://a3524-idle-restart-0.a3524-idle-restart-peer.kubebrain-dev.svc.cluster.local:3380,a3524-idle-restart-1=http://a3524-idle-restart-1.a3524-idle-restart-peer.kubebrain-dev.svc.cluster.local:3380,a3524-idle-restart-2=http://a3524-idle-restart-2.a3524-idle-restart-peer.kubebrain-dev.svc.cluster.local:3380
            - --keyspace=a3524-idle-restart
            - --max-delete-range-keys=1024
            - --max-request-rate=2000
            - --max-requests-inflight=1024
            - --max-watches=10000
            - --pd-addrs=kb-pd.tidb-cluster.svc:2379
            - --peer-port=3380
            - --port=3379
            - --quota-backend-bytes=1073741824
            - --request-rate-burst=4000
            - --v=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3379
              name: client
            - containerPort: 3380
              name: peer
            - containerPort: 8080
              name: info
          readinessProbe:
            httpGet:
              path: /ready
              port: client
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
