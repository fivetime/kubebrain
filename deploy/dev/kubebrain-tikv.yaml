apiVersion: v1
kind: Namespace
metadata:
  name: kubebrain-dev
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-peer
  namespace: kubebrain-dev
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kubebrain
  ports:
    - name: peer
      port: 3380
      targetPort: peer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubebrain
  namespace: kubebrain-dev
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  serviceName: kubebrain-peer
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain
    spec:
      containers:
        - name: kubebrain
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          args:
            - --port=3379
            - --peer-port=3380
            - --info-port=8080
            - --advertise-host=$(POD_NAME).kubebrain-peer.kubebrain-dev.svc
            - --initial-cluster=kubebrain-0=http://kubebrain-0.kubebrain-peer.kubebrain-dev.svc:3380,kubebrain-1=http://kubebrain-1.kubebrain-peer.kubebrain-dev.svc:3380,kubebrain-2=http://kubebrain-2.kubebrain-peer.kubebrain-dev.svc:3380
            - --pd-addrs=kb-pd.tidb-cluster.svc:2379
            - --compatible-with-etcd=true
            - --max-requests-inflight=1024
            - --max-request-rate=2000
            - --request-rate-burst=4000
            - --max-delete-range-keys=1024
            - --max-watches=10000
            - --v=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 3379
            - name: peer
              containerPort: 3380
            - name: info
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: client
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain
  namespace: kubebrain-dev
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubebrain
  ports:
    - name: client
      port: 3379
      targetPort: client
      nodePort: 30079
    - name: peer
      port: 3380
      targetPort: peer
      nodePort: 30080
    - name: info
      port: 8080
      targetPort: info
