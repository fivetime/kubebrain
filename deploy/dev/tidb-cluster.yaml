apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: kb
  namespace: tidb-cluster
spec:
  version: v8.5.3
  timezone: UTC
  pvReclaimPolicy: Delete
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate
  pd:
    baseImage: pingcap/pd
    replicas: 3
    requests:
      storage: 2Gi
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    requests:
      storage: 5Gi
    # Disposable local clusters often share a nearly-full development host.
    # Production must keep TiKV's reserve-space protection; this dev-only
    # manifest disables it so the requested 5Gi logical volume, rather than
    # the host filesystem's free percentage, defines the test capacity.
    config: |
      [storage]
      reserve-space = "0MiB"
      [raftstore]
      reserve-raft-space = "0MiB"
  tidb:
    baseImage: pingcap/tidb
    replicas: 1
    service:
      type: ClusterIP
    config: {}
