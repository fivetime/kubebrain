apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: kb
  namespace: tidb-cluster
spec:
  version: v8.5.3
  timezone: UTC
  pvReclaimPolicy: Delete
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate
  pd:
    baseImage: pingcap/pd
    replicas: 3
    # Keep the disposable integration cluster in the same compute QoS shape as
    # production. Storage remains deliberately small and hostPath-backed below.
    requests:
      cpu: "1"
      memory: "2Gi"
      storage: 2Gi
    limits:
      cpu: "2"
      memory: "4Gi"
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    requests:
      cpu: "4"
      memory: "8Gi"
      storage: 5Gi
    # TiDB Operator v1.6.5 maps limits.storage to tikv-server --capacity.
    # A raftstore.capacity TOML value is ineffective because the generated
    # command always supplies --capacity and the CLI value wins.
    limits:
      cpu: "8"
      memory: "16Gi"
      storage: 20Gi
    # Disposable local clusters often share a nearly-full development host.
    # Production must keep TiKV's reserve-space protection; this dev-only
    # manifest disables the recovery reserve and raises TiKV's logical store
    # capacity above the immutable 5Gi PVC request. This is safe only because
    # local-path exposes the Kind node filesystem. The hostPath filesystem is
    # still not a capacity-isolated CSI volume and must fail the production
    # storage-safety gate.
    config: |
      [storage]
      max-key-size = 2621440
      reserve-space = "0MiB"
      [raftstore]
      reserve-raft-space = "0MiB"
  tidb:
    baseImage: pingcap/tidb
    replicas: 1
    service:
      type: ClusterIP
    config: {}
