apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: kb
  namespace: tidb-cluster
spec:
  version: v8.5.3
  timezone: UTC
  pvReclaimPolicy: Delete
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate
  pd:
    baseImage: pingcap/pd
    replicas: 3
    requests:
      storage: 2Gi
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    requests:
      storage: 5Gi
    # TiDB Operator v1.6.5 maps limits.storage to tikv-server --capacity.
    # A raftstore.capacity TOML value is ineffective because the generated
    # command always supplies --capacity and the CLI value wins.
    limits:
      storage: 5Gi
    # Disposable local clusters often share a nearly-full development host.
    # Production must keep TiKV's reserve-space protection; this dev-only
    # manifest disables the recovery reserve and caps TiKV's logical store at
    # the requested 5Gi. The hostPath filesystem is still not a capacity-
    # isolated CSI volume and must fail the production storage-safety gate.
    config: |
      [storage]
      reserve-space = "0MiB"
      [raftstore]
      reserve-raft-space = "0MiB"
  tidb:
    baseImage: pingcap/tidb
    replicas: 1
    service:
      type: ClusterIP
    config: {}
