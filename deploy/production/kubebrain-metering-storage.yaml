apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebrain-metering-storage-policy
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-metering-storage
    app.kubernetes.io/part-of: kubebrain
data:
  source-prefix: kubebrain/
  allowed-formats-json: '["kubebrain.logical.v2"]'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebrain-metering-storage-archive
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-metering-storage
    app.kubernetes.io/part-of: kubebrain
spec:
  schedule: "27 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubebrain-metering-storage
            app.kubernetes.io/part-of: kubebrain
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: archiver
              image: kubebrain:dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/kubebrain-metering-storage-archive
              env:
                - name: SOURCE_S3_ENDPOINT
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: endpoint}}
                - name: SOURCE_AWS_REGION
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: region}}
                - name: SOURCE_AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: access-key-id}}
                - name: SOURCE_AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: secret-access-key}}
                - name: SOURCE_S3_FORCE_PATH_STYLE
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: force-path-style}}
                - name: SOURCE_OBJECT_STORE_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: object-store-id}}
                - name: SOURCE_BUCKET
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-source, key: bucket}}
                - name: METERING_S3_ENDPOINT
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: endpoint}}
                - name: METERING_AWS_REGION
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: region}}
                - name: METERING_AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: access-key-id}}
                - name: METERING_AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: secret-access-key}}
                - name: METERING_S3_FORCE_PATH_STYLE
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: force-path-style}}
                - name: METERING_OBJECT_STORE_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: object-store-id}}
                - name: METERING_BUCKET
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: bucket}}
                - name: SOURCE_PREFIX
                  valueFrom: {configMapKeyRef: {name: kubebrain-metering-storage-policy, key: source-prefix}}
                - name: ALLOWED_FORMATS_JSON
                  valueFrom: {configMapKeyRef: {name: kubebrain-metering-storage-policy, key: allowed-formats-json}}
              args:
                - --instance=kubebrain
                - --source-object-store-id=$(SOURCE_OBJECT_STORE_ID)
                - --source-bucket=$(SOURCE_BUCKET)
                - --source-prefix=$(SOURCE_PREFIX)
                - --allowed-formats-json=$(ALLOWED_FORMATS_JSON)
                - --metering-object-store-id=$(METERING_OBJECT_STORE_ID)
                - --metering-bucket=$(METERING_BUCKET)
                - --snapshot-prefix=metering-storage-samples
                - --retention-mode=COMPLIANCE
                - --retention-duration=61320h
                - --finalization-delay=10m
                - --timeout=20m
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebrain-metering-storage-rollup
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-metering-storage
    app.kubernetes.io/part-of: kubebrain
spec:
  schedule: "57 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubebrain-metering-storage
            app.kubernetes.io/part-of: kubebrain
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: roller
              image: kubebrain:dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/kubebrain-metering-storage-rollup
              env:
                - name: S3_ENDPOINT
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: endpoint}}
                - name: AWS_REGION
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: region}}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: access-key-id}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: secret-access-key}}
                - name: S3_FORCE_PATH_STYLE
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: force-path-style}}
                - name: OBJECT_STORE_ID
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: object-store-id}}
                - name: S3_BUCKET
                  valueFrom: {secretKeyRef: {name: kubebrain-metering-storage-evidence, key: bucket}}
              args:
                - --instance=kubebrain
                - --object-store-id=$(OBJECT_STORE_ID)
                - --bucket=$(S3_BUCKET)
                - --sample-prefix=metering-storage-samples
                - --rollup-prefix=metering-storage-rollups
                - --retention-mode=COMPLIANCE
                - --retention-duration=61320h
                - --finalization-delay=45m
                - --sample-finalization-delay=10m
                - --timeout=20m
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
