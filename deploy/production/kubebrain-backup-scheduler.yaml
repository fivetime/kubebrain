apiVersion: v1
kind: ConfigMap
metadata:
  name: kubebrain-backup-scheduler-inventory
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-backup-scheduler
    app.kubernetes.io/part-of: kubebrain
data:
  namespaces.json: '["kubebrain-operations"]'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-backup-scheduler
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-backup-scheduler
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-backup-scheduler
  namespace: kubebrain-operations
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kubebrain-backup-scheduler-inventory
    verbs:
      - get
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainbackuppolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainoperations
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubebrain-backup-scheduler-managed-namespace
rules:
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainbackuppolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainoperations
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-backup-scheduler
  namespace: kubebrain-operations
subjects:
  - kind: ServiceAccount
    name: kubebrain-backup-scheduler
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-backup-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebrain-backup-scheduler
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-backup-scheduler
    app.kubernetes.io/part-of: kubebrain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-backup-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain-backup-scheduler
        app.kubernetes.io/part-of: kubebrain
    spec:
      serviceAccountName: kubebrain-backup-scheduler
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain-backup-scheduler
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain-backup-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/kubebrain-backup-scheduler
          args:
            - --namespace-inventory-configmap=kubebrain-backup-scheduler-inventory
            - --namespace-inventory-namespace=kubebrain-operations
            - --namespace-inventory-key=namespaces.json
            - --requested-by=system:serviceaccount:kubebrain-operations:kubebrain-backup-scheduler
            - --poll-interval=30s
            - --reconcile-timeout=2m
            - --max-policies=256
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain-backup-scheduler
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-backup-scheduler
    app.kubernetes.io/part-of: kubebrain
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-backup-scheduler
