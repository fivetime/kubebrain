apiVersion: v1
kind: Namespace
metadata:
  name: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/component: client
    dbaas.kubebrain.io/instance: kubebrain
    dbaas.kubebrain.io/dedicated: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: peer
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/instance: kubebrain
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
spec:
  serviceName: kubebrain-peer
  replicas: 3
  revisionHistoryLimit: 5
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/instance: kubebrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain
        app.kubernetes.io/instance: kubebrain
    spec:
      serviceAccountName: kubebrain
      priorityClassName: kubebrain-dbaas-critical
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kubebrain
                  app.kubernetes.io/instance: kubebrain
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubebrain
                    app.kubernetes.io/instance: kubebrain
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: kubebrain
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            # Pod deletion withdraws the EndpointSlice target first. Continue
            # serving established connections while that update reaches
            # kube-proxy, then release leadership and migrate transports before
            # SIGTERM.
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5 && curl --insecure --fail --silent --show-error --max-time 10 --request POST https://127.0.0.1:8080/drain && sleep 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          args:
            - --port=3379
            - --peer-port=3380
            - --info-port=8080
            - --info-cert-file=/etc/kubebrain/info-tls/tls.crt
            - --info-key-file=/etc/kubebrain/info-tls/tls.key
            - --advertise-host=$(POD_NAME).kubebrain-peer.kubebrain-system.svc.cluster.local
            - --advertise-client-urls=http://kubebrain-client.kubebrain-system.svc:3379
            - --initial-cluster=kubebrain-0=http://kubebrain-0.kubebrain-peer.kubebrain-system.svc.cluster.local:3380,kubebrain-1=http://kubebrain-1.kubebrain-peer.kubebrain-system.svc.cluster.local:3380,kubebrain-2=http://kubebrain-2.kubebrain-peer.kubebrain-system.svc.cluster.local:3380
            - --pd-addrs=kb-pd.tidb-cluster.svc:2379
            - --tikv-client-num=16
            - --keyspace=kubebrain-system
            - --cluster-name=kubebrain-system
            - --compatible-with-etcd=true
            - --enable-count-index=true
            - --count-index-max-keys=5000000
            - --enable-storage-metrics=true
            - --enable-grpc-gateway=true
            - --allow-insecure=false
            - --peer-allow-insecure=false
            - --enable-pprof=false
            - --cors=http://kubebrain-client.kubebrain-system.svc:3379
            - --quota-backend-bytes=429496729600
            # A TiKV Region leader election takes 10-20s with upstream defaults.
            # Stay authoritative across that bounded storage failover so etcd's
            # checkpoint-free lease renewals do not lose their in-memory leader.
            # ReleaseOnCancel still clears the lease during an orderly rollout.
            - --leader-lease-duration=30s
            - --leader-renew-deadline=25s
            - --leader-retry-period=500ms
            - --max-txn-ops=128
            - --max-request-bytes=1572864
            - --max-concurrent-streams=4294967295
            - --max-requests-inflight=1024
            - --max-request-rate=2000
            - --request-rate-burst=4000
            - --max-delete-range-keys=1024
            - --max-watches=10000
            - --grpc-keepalive-min-time=5s
            - --grpc-keepalive-interval=2h
            - --grpc-keepalive-timeout=20s
            - --auth-token=simple
            - --bcrypt-cost=10
            - --auth-token-ttl=300
            - --host-whitelist=kubebrain-client.kubebrain-system.svc
            - --v=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TMPDIR
              value: /var/lib/kubebrain-snapshot
          ports:
            - name: client
              containerPort: 3379
            - name: peer
              containerPort: 3380
            - name: info
              containerPort: 8080
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /ready
              port: info
            initialDelaySeconds: 5
            periodSeconds: 5
            # The server bounds the backing linearizable read at five seconds.
            # Let it report the authoritative result instead of having kubelet
            # cancel an otherwise successful TiKV failover read first.
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /ping
              port: info
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /ping
              port: info
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          volumeMounts:
            - name: snapshot-tmp
              mountPath: /var/lib/kubebrain-snapshot
            - name: info-tls
              mountPath: /etc/kubebrain/info-tls
              readOnly: true
      volumes:
        - name: snapshot-tmp
          emptyDir:
            sizeLimit: 512Gi
        - name: info-tls
          secret:
            secretName: kubebrain-info-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-client
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
  ports:
    - name: client
      port: 3379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-peer
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
  ports:
    - name: peer
      port: 3380
      targetPort: peer
    - name: info
      port: 8080
      targetPort: info
