apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebrain-backup-executor
  namespace: kubebrain-operations
  labels: &backupLabels
    app.kubernetes.io/name: kubebrain-backup-executor
    app.kubernetes.io/part-of: kubebrain
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: *backupLabels
  template:
    metadata:
      labels: *backupLabels
    spec:
      serviceAccountName: kubebrain-backup-executor
      automountServiceAccountToken: true
      securityContext: &podSecurity
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: *backupLabels}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: *backupLabels}
      containers:
        - name: executor
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/kubebrain-operation-worker]
          args:
            - --executable=/opt/kubebrain/hack/production/run-backup-operation.sh
            - --idle-delay=10s
            - --failure-delay=15s
          env: &commonEnv
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - {name: OPERATIONCTL, value: /usr/local/bin/kubebrain-operationctl}
            - {name: OPERATION_NAMESPACE, value: kubebrain-operations}
            - {name: OPERATION_NAMESPACE_INVENTORY_CONFIGMAP, value: kubebrain-backup-scheduler-inventory}
            - {name: OPERATION_NAMESPACE_INVENTORY_NAMESPACE, value: kubebrain-operations}
            - {name: OPERATION_NAMESPACE_INVENTORY_KEY, value: namespaces.json}
            - {name: OPERATION_PARAMETERS_ENDPOINT, value: "https://kubebrain-operation-parameter-broker.kubebrain-operations.svc"}
            - {name: OPERATION_PARAMETERS_TOKEN_FILE, value: /var/run/secrets/kubebrain-parameter/token}
            - {name: OPERATION_PARAMETERS_CA_FILE, value: /var/run/secrets/kubebrain-parameter-ca/ca.crt}
            - {name: EXPORT_COMMAND, value: /usr/local/bin/kubebrain-logical-export}
            - {name: STATUS_COMMAND, value: /usr/local/bin/kubebrain-logical-status}
            - {name: OBJECT_COMMAND, value: /usr/local/bin/kubebrain-logical-object}
          envFrom:
            - secretRef:
                name: kubebrain-backup-executor-env
          resources: &resources
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: &workspaceMounts
            - {name: workspace, mountPath: /var/lib/kubebrain-operation}
            - {name: tmp, mountPath: /tmp}
            - {name: parameter-token, mountPath: /var/run/secrets/kubebrain-parameter, readOnly: true}
            - {name: parameter-ca, mountPath: /var/run/secrets/kubebrain-parameter-ca, readOnly: true}
      volumes: &workspaceVolumes
        - name: workspace
          persistentVolumeClaim:
            claimName: kubebrain-backup-executor-workspace
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: parameter-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, audience: kubebrain-operation-parameters, expirationSeconds: 3600}
        - name: parameter-ca
          configMap:
            name: kubebrain-operation-parameter-broker-ca
            items: [{key: ca.crt, path: ca.crt}]
---
