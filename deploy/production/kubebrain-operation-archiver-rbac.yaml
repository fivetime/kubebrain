apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-operation-archiver
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-archiver
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-operation-archiver
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-archiver
    app.kubernetes.io/part-of: kubebrain
rules:
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainoperations
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-operation-archiver
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-archiver
    app.kubernetes.io/part-of: kubebrain
subjects:
  - kind: ServiceAccount
    name: kubebrain-operation-archiver
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-operation-archiver
