apiVersion: v1
kind: Namespace
metadata:
  name: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
---
apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: kb
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
spec:
  version: v8.5.3
  timezone: UTC
  pvReclaimPolicy: Retain
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate
  imagePullPolicy: IfNotPresent
  pd:
    baseImage: pingcap/pd
    replicas: 3
    maxFailoverCount: 3
    statefulSetUpdateStrategy: RollingUpdate
    terminationGracePeriodSeconds: 60
    requests:
      cpu: "1"
      memory: "2Gi"
      storage: "100Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tidb-cluster
                app.kubernetes.io/instance: kb
                app.kubernetes.io/component: pd
            topologyKey: kubernetes.io/hostname
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    maxFailoverCount: 3
    evictLeaderTimeout: 10m
    statefulSetUpdateStrategy: RollingUpdate
    terminationGracePeriodSeconds: 300
    requests:
      cpu: "4"
      memory: "8Gi"
      storage: "500Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tidb-cluster
                app.kubernetes.io/instance: kb
                app.kubernetes.io/component: tikv
            topologyKey: kubernetes.io/hostname
    config: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kb-pd
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: pd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kb-tikv
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: tikv
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
