apiVersion: v1
kind: Namespace
metadata:
  name: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    dbaas.kubebrain.io/instance: kubebrain
    dbaas.kubebrain.io/dedicated: "true"
---
apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: kb
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
spec:
  version: v8.5.3
  timezone: UTC
  pvReclaimPolicy: Retain
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate
  imagePullPolicy: IfNotPresent
  pd:
    baseImage: pingcap/pd
    replicas: 3
    maxFailoverCount: 3
    statefulSetUpdateStrategy: RollingUpdate
    terminationGracePeriodSeconds: 60
    requests:
      cpu: "1"
      memory: "2Gi"
      storage: "100Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tidb-cluster
                app.kubernetes.io/instance: kb
                app.kubernetes.io/component: pd
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tidb-cluster
                  app.kubernetes.io/instance: kb
                  app.kubernetes.io/component: pd
              topologyKey: topology.kubernetes.io/zone
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    maxFailoverCount: 3
    evictLeaderTimeout: 10m
    statefulSetUpdateStrategy: RollingUpdate
    terminationGracePeriodSeconds: 300
    requests:
      cpu: "4"
      memory: "8Gi"
      storage: "500Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tidb-cluster
                app.kubernetes.io/instance: kb
                app.kubernetes.io/component: tikv
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tidb-cluster
                  app.kubernetes.io/instance: kb
                  app.kubernetes.io/component: tikv
              topologyKey: topology.kubernetes.io/zone
    config: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kb-pd
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: pd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kb-tikv
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: tikv
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
---
apiVersion: v1
kind: Service
metadata:
  name: kb-pd-metrics
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: pd
    app.kubernetes.io/part-of: kubebrain
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: pd
  ports:
    - name: metrics
      port: 2379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: kb-tikv-metrics
  namespace: tidb-cluster
  labels:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: tikv
    app.kubernetes.io/part-of: kubebrain
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tidb-cluster
    app.kubernetes.io/instance: kb
    app.kubernetes.io/component: tikv
  ports:
    - name: metrics
      port: 20180
      targetPort: 20180
