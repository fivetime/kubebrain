apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-certificate-rotation-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}
  matchConditions:
    - name: certificate-rotation-scope
      expression: 'object.spec.type == "CertificateRotation" || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-certificate-rotation-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-certificate-rotation-requester"', message: certificate rotation operations require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations"', message: certificate rotation requester is restricted to the production operation queue}
    - {expression: 'object.metadata.name.matches("^cert-rotate-[a-f0-9]{20}$") && object.spec.operationID == object.metadata.name', message: certificate rotation operation identity must be deterministic}
    - {expression: 'object.spec.type == "CertificateRotation" && object.spec.requestedBy == "platform:certificate-rotation" && object.spec.instance.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && object.spec.maxAttempts == 5', message: certificate rotation operation shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$")', message: certificate rotation operation must bind its immutable parameter Secret}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-certificate-rotation-request-operation}
spec: {policyName: kubebrain-certificate-rotation-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-certificate-rotation-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}
  matchConditions:
    - name: certificate-rotation-parameter-scope
      expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^cert-rotate-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-certificate-rotation-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-certificate-rotation-requester"', message: certificate rotation parameter Secrets require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^cert-rotate-[a-f0-9]{20}-parameters$")', message: certificate rotation parameter Secret identity is fixed}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: certificate rotation parameters must be one immutable opaque payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-certificate-rotation-request-parameters}
spec: {policyName: kubebrain-certificate-rotation-request-parameters, validationActions: [Deny]}
