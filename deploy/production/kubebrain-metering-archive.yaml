apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebrain-metering-archive
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-metering-archive
    app.kubernetes.io/part-of: kubebrain
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubebrain-metering-archive
            app.kubernetes.io/part-of: kubebrain
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: archiver
              image: kubebrain:dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/kubebrain-metering-archive
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: endpoint
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: region
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: secret-access-key
                - name: S3_FORCE_PATH_STYLE
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: force-path-style
                - name: OBJECT_STORE_ID
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: object-store-id
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-archive-object-store
                      key: bucket
              args:
                - --prometheus-url=http://prometheus-operated.kubebrain-system.svc.cluster.local:9090
                - --instance=kubebrain
                - --object-store-id=$(OBJECT_STORE_ID)
                - --bucket=$(S3_BUCKET)
                - --object-prefix=metering-samples
                - --retention-mode=COMPLIANCE
                - --retention-duration=61320h
                - --slot-duration=1h
                - --finalization-delay=10m
                - --max-staleness=5m
                - --timeout=10m
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
