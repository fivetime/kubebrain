            description: "At least one current Ready Pod UID has not published watch_revision_lag within 60 seconds, the invalid-value recording is absent, or a lag is NaN, infinite, negative, fractional, or above 2^53. Every replica emits an immediate value and refreshes the gauge every 15 seconds, including an authoritative zero while idle, so missing, stale, or invalid telemetry cannot be interpreted as an empty watch backlog. Check mixed binary rollout, Pod UID relabeling, and application scrape health."
        - alert: KubeBrainGrpcLatencyHigh
          expr: histogram_quantile(0.99, sum by (le, grpc_method) (rate(grpc_server_handling_seconds_bucket{namespace="kubebrain-system"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain p99 gRPC latency is high
            description: "KubeBrain p99 gRPC latency for {{ $labels.grpc_method }} is above 1 second."
        - alert: KubeBrainCountIndexOverflowed
          expr: max(kubebrain_dbaas:count_index_overflowed:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index exceeded its key limit
            description: "A current Ready Pod UID with count-index samples no older than 60 seconds reports that the leader count index overflowed and exact counts are falling back to TiKV scans. Stale replaced Pod samples are excluded. Increase the instance memory tier and --count-index-max-keys together."
        - alert: KubeBrainCountIndexMetricsMissing
          expr: absent(kubebrain_dbaas:count_index_invalid_values:count) == 1 or count(kubebrain_dbaas:count_index_overflowed:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:count_index_invalid_values:count != 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count-index telemetry is incomplete
            description: "At least one current Ready Pod UID has not published count_index_overflowed within 60 seconds, the invalid-value recording is absent, or the gauge is not exactly 0 or 1. Production enables the count index on every replica and refreshes this gauge every 15 seconds, so missing, stale, or invalid telemetry cannot be interpreted as a healthy non-overflowed index. Check mixed binary/configuration rollout, Pod UID relabeling, and application scrape health."
        - alert: KubeBrainCountIndexRebuildFailures
          expr: sum(kubebrain_dbaas:count_index_rebuild_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index rebuild failed
            description: "A current Ready leader reported a fresh count-index rebuild failure in the last 10 minutes; CountOnly requests may be falling back to TiKV scans."
        - alert: KubeBrainCountIndexRebuildMetricsMissing
          expr: absent(kubebrain_dbaas:count_index_rebuild_err_invalid_values:count) == 1 or count(kubebrain_dbaas:count_index_rebuild_err:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:count_index_rebuild_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:count_index_rebuild_err_invalid_values:count != 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count-index rebuild-error telemetry is incomplete
            description: "At least one current Ready Pod UID lacks a count-index rebuild-error current or 10-minute-increase series with a sample no older than 60 seconds, the invalid-value recording is absent, or a value is invalid. Every replica initializes the counter to an authoritative zero before leadership. Current counters must be non-negative exact integers no greater than 2^53; extrapolated increases may be fractional but must be finite and within [0,2^53]. Missing, stale, or invalid telemetry must not be interpreted as zero count-index rebuild failures."
        - alert: KubeBrainRangeStreamFailures
          expr: sum(kubebrain_dbaas:range_stream_failure:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain backend range stream failed
            description: "A current Ready replica reported a non-cancellation RangeStream worker failure in the last ten minutes. Large reads, watch-cache cold starts, or count-index rebuilds may have terminated early; inspect PD/TiKV availability and correlate the affected request before retrying. Caller cancellation is excluded from this counter."
        - alert: KubeBrainRangeStreamMetricsMissing
          expr: absent(kubebrain_dbaas:range_stream_failure_invalid_values:count) == 1 or count(kubebrain_dbaas:range_stream_failure:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:range_stream_failure:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:range_stream_failure_invalid_values:count != 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain range-stream failure telemetry is incomplete
            description: "Every current Ready Pod UID must expose the authoritative-zero backend RangeStream failure counter as fresh current and 10-minute-increase series. Current values must be non-negative exact integers within 2^53 and increases finite in range. Missing, stale, or invalid telemetry cannot prove that storage-backed streams are completing without worker failures."
        - alert: KubeBrainSlowReadIndexes
          expr: sum(kubebrain_dbaas:read_index:increase_10m_by_pod_outcome{outcome="slow"} * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain read-index barriers timed out
            description: "Current Ready replicas reported follower/leader read-index barriers that exhausted a deadline or transport timeout in the last ten minutes. Requests failed closed rather than reading through an unconfirmed leader revision; inspect leader freshness, peer /status reachability, and TiKV/PD latency."
        - alert: KubeBrainReadIndexFailures
          expr: sum(kubebrain_dbaas:read_index:increase_10m_by_pod_outcome{outcome="failed"} * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain read-index barriers failed
            description: "Current Ready replicas rejected read-index barriers for a non-timeout failure in the last ten minutes, including stale local leadership, leader changes, or invalid leader status. The affected linearizable request failed closed; correlate leader-election and peer identity telemetry before retrying."
        - alert: KubeBrainReadIndexMetricsMissing
          expr: absent(kubebrain_dbaas:read_index_invalid_values:count) == 1 or count(kubebrain_dbaas:read_index:current_by_pod_outcome * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != 2 * count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:read_index:increase_10m_by_pod_outcome * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != 2 * count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:read_index_invalid_values:count != 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain read-index telemetry is incomplete
            description: "Every current Ready Pod UID must expose authoritative-zero slow and failed counters as fresh current and 10-minute-increase series. Current values must be non-negative exact integers within 2^53 and increases finite in range. Missing, stale, invalid, or incomplete telemetry cannot prove that unsafe or unavailable read barriers are rejected rather than silently bypassed."
        - alert: KubeBrainSerializableCheckpointUnavailable
          expr: absent(kubebrain_dbaas:serializable_checkpoint_invalid_values:count) == 1 or count(kubebrain_dbaas:serializable_checkpoint_available:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:serializable_checkpoint_revision:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:serializable_checkpoint_remaining_seconds:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:serializable_checkpoint_invalid_values:count != 0 or min(kubebrain_dbaas:serializable_checkpoint_available:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) < 1 or min(kubebrain_dbaas:serializable_checkpoint_revision:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) <= 0 or min(kubebrain_dbaas:serializable_checkpoint_remaining_seconds:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) < 60
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: KubeBrain serializable checkpoint is unavailable
            description: "At least one current Ready KubeBrain replica lacks a fresh positive-revision GC-protected checkpoint, has less than 60 seconds left in its local safety window, stopped publishing any of the available, revision, and remaining-seconds checkpoint gauges for 60 seconds, or publishes an invalid available/revision/remaining-seconds value, so bounded PD-isolated serializable Range, read-only Txn, and RangeStream service is unavailable or at risk. Available must be exactly 0 or 1; revision must be a positive exact integer no greater than 2^53; remaining seconds must be a non-negative exact integer no greater than 2^53. Expected telemetry follows Pod UID identities whose KSM Ready samples are no older than 60 seconds during scaling; stale replaced Pod identities are excluded. Missing, stale, or invalid checkpoint evidence must not authorize isolated reads. Check scrape health, PD service GC safepoints, Region/store directory warmup, and checkpoint refresh errors."
        - alert: KubeBrainSerializableCheckpointRefreshFailures
          expr: sum(kubebrain_dbaas:serializable_checkpoint_refresh_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain serializable checkpoint refresh failed
            description: "A current Ready KubeBrain Pod UID reported a fresh serializable checkpoint refresh failure. KubeBrain failed to create, load, protect, or warm a checkpoint. Existing snapshots remain usable only until serializable_checkpoint_remaining_seconds reaches zero."
        - alert: KubeBrainSerializableCheckpointRefreshMetricsMissing
          expr: absent(kubebrain_dbaas:serializable_checkpoint_refresh_err_invalid_values:count) == 1 or count(kubebrain_dbaas:serializable_checkpoint_refresh_err:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:serializable_checkpoint_refresh_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:serializable_checkpoint_refresh_err_invalid_values:count != 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain serializable checkpoint refresh-error telemetry is incomplete
            description: "At least one current Ready Pod UID lacks a refresh-error current or 10-minute-increase series with a sample no older than 60 seconds, the invalid-value recording is absent, or a value is invalid. Every replica initializes the counter to an authoritative zero. Current counters must be non-negative exact integers no greater than 2^53; extrapolated increases may be fractional but must be finite and within [0,2^53]. Missing, stale, or invalid telemetry must not be interpreted as zero checkpoint refresh failures."
        - alert: KubeBrainHealthCheckpointFallback
          expr: sum by (check) (kubebrain_dbaas:health_checkpoint_fallback:increase_10m_by_pod_check * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain health probe used a protected checkpoint
            description: "A current Ready KubeBrain Pod UID whose KSM Ready and health counter samples are no older than 60 seconds entered {{ $labels.check }} checkpoint fallback {{ $value }} times in 10 minutes. Fresh counter increases are deduplicated by Pod UID and check; stale counters from replaced Pods or stopped scrapes are excluded. Current counter values must be non-negative exact integers no greater than 2^53, and extrapolated increases must be finite and within [0,2^53]. A successful liveness response is bounded-stale degraded service, not proof that PD/TiKV recovered. Inspect PD/TiKV quorum, serializable checkpoint lifetime, and refresh errors."
        - alert: KubeBrainHealthCheckpointFallbackMetricsMissing
          expr: absent(kubebrain_dbaas:health_checkpoint_fallback_invalid_values:count) == 1 or count(kubebrain_dbaas:health_checkpoint_fallback:current_by_pod_check * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != 3 * count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:health_checkpoint_fallback:increase_10m_by_pod_check * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != 3 * count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:health_checkpoint_fallback_invalid_values:count != 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain health fallback metrics are incomplete
            description: "At least one Ready KubeBrain replica does not expose exactly three initialized health_checkpoint_fallback current and 10-minute-increase series with samples no older than 60 seconds, the invalid-value recording is absent, or a counter/increase value is invalid. Current counters must be non-negative exact integers no greater than 2^53; extrapolated increases may be fractional but must be finite and within [0,2^53]. The expected series count follows Pod UID identities whose KSM Ready samples are also no older than 60 seconds, including during scaling; stale replaced Pod identities and stopped application scrapes are excluded. Missing, stale, or invalid fallback telemetry must not be interpreted as zero degraded-health events. Check for mixed binary versions, missing pod UID relabeling, stale scrape targets, or an incomplete metrics registry before trusting the fallback alert."
        - alert: KubeBrainQuotaNoSpace
          expr: max(kubebrain_dbaas:quota_nospace:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain tenant quota is blocking growth writes
            description: "A persistent NOSPACE alarm is active. Delete data or revoke leases to reduce logical usage, then disarm the alarm."
        - alert: KubeBrainQuotaUsageHigh
          expr: max((kubebrain_dbaas:quota_logical_usage_bytes:max_by_pod / kubebrain_dbaas:quota_backend_bytes:max_by_pod) * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain tenant logical quota usage is high
            description: "Logical key/value usage exceeds 90% of the configured tenant quota."
        - alert: KubeBrainQuotaMetricsInconsistent
          expr: absent(kubebrain_dbaas:quota_invalid_values:count) == 1 or count(kubebrain_dbaas:quota_nospace:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:quota_backend_bytes:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:quota_logical_usage_bytes:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:quota_invalid_values:count != 0 or (max(kubebrain_dbaas:quota_nospace:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) - min(kubebrain_dbaas:quota_nospace:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0) or (max(kubebrain_dbaas:quota_backend_bytes:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) - min(kubebrain_dbaas:quota_backend_bytes:max_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain replicas disagree on tenant quota state
            description: "Quota metric series are missing or duplicated for current Ready replicas, have stopped publishing for 60 seconds, contain an invalid NOSPACE/backend/usage value, report logical usage above the configured backend quota, or Ready replicas have reported different configured quota/NOSPACE state for more than one refresh interval. NOSPACE must be exactly 0 or 1; backend quota must be a positive exact byte integer no greater than 2^53; logical usage must be a non-negative exact byte integer no greater than both 2^53 and backend quota. Expected telemetry follows Pod UID identities whose KSM Ready and quota samples are no older than 60 seconds during scaling; stale replaced Pod identities and stale quota samples are excluded. Invalid numerator or denominator telemetry must not be interpreted as healthy quota headroom."
        - alert: KubeBrainQuotaRefreshFailures
          expr: sum(kubebrain_dbaas:quota_refresh_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain failed to refresh tenant quota metrics
            description: "At least one current Ready replica reported a fresh failure to read shared quota metadata from TiKV in the last 10 minutes."
        - alert: KubeBrainQuotaRefreshMetricsMissing
          expr: absent(kubebrain_dbaas:quota_refresh_err_invalid_values:count) == 1 or count(kubebrain_dbaas:quota_refresh_err:current_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or count(kubebrain_dbaas:quota_refresh_err:increase_10m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) != count(kubebrain_dbaas:ready_pods:current) or kubebrain_dbaas:quota_refresh_err_invalid_values:count != 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain quota refresh-error telemetry is incomplete
            description: "At least one current Ready Pod UID lacks a quota refresh-error current or 10-minute-increase series with a sample no older than 60 seconds, the invalid-value recording is absent, or a value is invalid. Every replica initializes the counter to an authoritative zero. Current counters must be non-negative exact integers no greater than 2^53; extrapolated increases may be fractional but must be finite and within [0,2^53]. Missing, stale, or invalid telemetry must not be interpreted as zero quota refresh failures."
    - name: kubebrain.storage
      rules:
        - alert: KubeBrainPDInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:pd_replicas:expected < 3 or count(max by (instance) (up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1)) != on() kubebrain_dbaas:pd_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD scrapeable replicas do not match the required topology
            description: "The PD StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent or contains a negative, fractional, non-finite, or greater-than-2^53 replica count."
        - alert: KubeBrainTiKVInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:tikv_replicas:expected < 3 or count(max by (instance) (up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1)) != on() kubebrain_dbaas:tikv_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV scrapeable replicas do not match the required topology
            description: "The TiKV StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent or contains a negative, fractional, non-finite, or greater-than-2^53 replica count."
        - alert: KubeBrainPDLeaderUnavailable
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or absent(kubebrain_dbaas:storage_control_plane_invalid_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:storage_control_plane_invalid_values:count != 0 or count(kubebrain_dbaas:pd_is_leader:max_by_instance) != on() kubebrain_dbaas:pd_replicas:expected or sum(kubebrain_dbaas:pd_is_leader:max_by_instance) != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD leader telemetry is incomplete or does not report exactly one leader
            description: "Fresh deduplicated PD leader gauges do not cover every current PD replica, a leader/Region value is invalid, the expectation chain is absent, or the cluster does not report exactly one leader. PD leader must be exactly 0 or 1; Region counts must be non-negative exact integers no greater than 2^53. Inputs must have samples within 60 seconds."
        - alert: KubeBrainTiKVRegionLeaderMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or absent(kubebrain_dbaas:storage_control_plane_invalid_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:storage_control_plane_invalid_values:count != 0 or count(kubebrain_dbaas:tikv_leader_missing:max_by_instance) != on() kubebrain_dbaas:tikv_replicas:expected or max(kubebrain_dbaas:tikv_leader_missing:max_by_instance) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV Region leader telemetry is incomplete or reports missing leaders
            description: "Fresh deduplicated TiKV leader-missing gauges do not cover every current TiKV replica, a leader/Region value is invalid, the expectation chain is absent, or at least one store reports Regions without a leader. Missing-leader and Region counts must be non-negative exact integers no greater than 2^53; PD leader must be exactly 0 or 1. Inputs must have samples within 60 seconds."
        - alert: KubeBrainPDRegionPeerUnhealthy
          expr: max by (type) (kubebrain_dbaas:pd_region_status:max_by_instance_type) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD reports persistent unhealthy Region peers
            description: "PD has {{ $value }} Regions in {{ $labels.type }}. Run validate-tikv-region-health.sh and inspect the reported Region/store identities before any repair."
        - alert: KubeBrainPDRegionHealthMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or absent(kubebrain_dbaas:storage_control_plane_invalid_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:storage_control_plane_invalid_values:count != 0 or count(kubebrain_dbaas:pd_region_status:max_by_instance_type) != on() (2 * kubebrain_dbaas:pd_replicas:expected)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain PD Region health metrics are incomplete
            description: "Fresh deduplicated pending/down peer Region gauge sources do not exactly equal two series per current PD StatefulSet replica, a leader/Region value is invalid, or the replica expectation chain is absent. Region counts must be non-negative exact integers no greater than 2^53, and PD leader must be exactly 0 or 1. Inputs must have samples within 60 seconds."
        - alert: KubeBrainPDWALFsyncLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{namespace="tidb-cluster",service="kb-pd-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD WAL fsync latency threatens leader availability
            description: "PD {{ $labels.instance }} WAL fsync p99 is {{ $value }}s, above the 1s storage SLO. This can delay Raft heartbeats and expire the PD leader lease before replica-count or Region-health alerts fire."
        - alert: KubeBrainTiKVRaftDBWriteLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(tikv_raftstore_store_write_raftdb_duration_seconds_bucket{namespace="tidb-cluster",service="kb-tikv-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV RaftDB write latency is high
            description: "TiKV {{ $labels.instance }} RaftDB write p99 is {{ $value }}s, above the 1s storage SLO. Short etcd leases and mutation availability are at risk even if all stores remain Up."
        - alert: KubeBrainTiKVKVDBWriteLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(tikv_raftstore_store_write_kvdb_duration_seconds_bucket{namespace="tidb-cluster",service="kb-tikv-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV KVDB write latency is high
            description: "TiKV {{ $labels.instance }} KVDB write p99 is {{ $value }}s, above the 1s storage SLO. Treat the instance as outside its short-lease availability envelope."
        - alert: KubeBrainStorageLatencyMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or count(max by (instance) (etcd_disk_wal_fsync_duration_seconds_count{namespace="tidb-cluster",service="kb-pd-metrics"})) != on() kubebrain_dbaas:pd_replicas:expected or count(max by (instance) (tikv_raftstore_store_write_raftdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"})) != on() kubebrain_dbaas:tikv_replicas:expected or count(max by (instance) (tikv_raftstore_store_write_kvdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"})) != on() kubebrain_dbaas:tikv_replicas:expected
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage latency telemetry is incomplete
            description: "Deduplicated PD WAL and TiKV RaftDB/KVDB write histogram source counts do not exactly match the current PD/TiKV StatefulSet replica expectations, or an expectation recording series is absent. Do not declare the short-lease storage SLO healthy while any family is missing."
        - alert: KubeBrainStorageLatencyMetricsStale
          expr: (max(time() - max by (instance) (timestamp(etcd_disk_wal_fsync_duration_seconds_count{namespace="tidb-cluster",service="kb-pd-metrics"}))) > 60) or (max(time() - max by (instance) (timestamp(tikv_raftstore_store_write_raftdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"}))) > 60) or (max(time() - max by (instance) (timestamp(tikv_raftstore_store_write_kvdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"}))) > 60)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage latency telemetry is stale
            description: "At least one PD WAL or TiKV RaftDB/KVDB instance has no fresh histogram sample from any HA scrape replica for more than 60 seconds. Per-instance freshness uses the newest duplicate sample; Prometheus lookback may still expose older replicas and must not create a false stale alert."
        - alert: KubeBrainStorageVolumeMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:storage_replicas:expected) == 1 or absent(kubebrain_dbaas:storage_volumes:expected) == 1 or absent(kubebrain_dbaas:storage_requested_sources:count) == 1 or absent(kubebrain_dbaas:storage_volume_identity_mismatches:count) == 1 or absent(kubebrain_dbaas:storage_active_volume_sources:count) == 1 or absent(kubebrain_dbaas:storage_capacity_sources:count) == 1 or absent(kubebrain_dbaas:storage_available_sources:count) == 1 or absent(kubebrain_dbaas:storage_volume_stats_identity_mismatches:count) == 1 or absent(kubebrain_dbaas:storage_invalid_byte_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:storage_volumes:expected < on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_requested_sources:count != on() kubebrain_dbaas:storage_volumes:expected or kubebrain_dbaas:storage_volume_identity_mismatches:count != 0 or kubebrain_dbaas:storage_active_volume_sources:count != on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_capacity_sources:count != on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_available_sources:count != on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_volume_stats_identity_mismatches:count != 0 or kubebrain_dbaas:storage_invalid_byte_values:count != 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage volume metrics are incomplete
            description: "Fresh KSM requested-storage sources do not exactly cover the same PVC identities as every current matching PD/TiKV PVC object, fresh Pod volume declarations do not identify exactly one data PVC per active storage replica, kubelet capacity/available identities do not exactly equal that active PVC set, fewer PVC objects exist than active replicas, a byte value is not an exact integer within 2^53, requested/capacity is non-positive, available is negative or exceeds capacity, capacity is below the PVC request, or an expectation/source recording series is absent. KSM inputs must have samples within 60 seconds. Invalid byte values also block metering completeness instead of being masked by used-byte clamping. Retained scale-down PVCs remain provisioned and billable until deletion even when unmounted, but must not substitute for missing active volume statistics. Verify kube-state-metrics and that the production CSI driver implements volume statistics."
        - alert: KubeBrainStorageVolumeLow
          expr: (kubebrain_dbaas:storage_available_bytes:min_by_pvc / kubebrain_dbaas:storage_capacity_bytes:max_by_pvc) < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain storage volume has less than 15% free space
            description: "PVC {{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} free space using the most conservative deduplicated available/capacity samples received within 60 seconds."
    - name: kubebrain.resources
      rules:
        - alert: KubeBrainMeteringDataIncomplete
          expr: (kubebrain_dbaas:metering_data_complete or on() vector(0)) != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain billing inputs are incomplete
            description: "KubeBrain, PD, TiKV, or PVC metric source counts do not exactly match the current deduplicated StatefulSet replica expectations, a CPU/network rate is non-finite, negative, or above 2^53, a memory byte value is not an exact non-negative integer within 2^53, a storage/backup value is invalid, a replica expectation is missing, a required backup source is not unique, or the completeness recording series itself is absent. Canonical value checks run before minute/hour completeness; invalid usage cannot accumulate an apparently billable slot. Billing export must fail closed for this interval, including during incomplete scaling."
        - alert: KubeBrainObjectRequestMeteringDataIncomplete
          expr: (kubebrain_dbaas:object_request_data_complete or on() vector(0)) != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain object request billing inputs are incomplete
            description: "The provider request exporter does not expose within 60 seconds exactly one finalized hourly count for every write, list, read, and delete class plus exactly one period-end series, exposes any missing or unexpected request_class, publishes a negative, fractional, or greater-than-2^53 value, publishes a period-end outside an exact UTC hour boundary, or the completeness recording series itself is absent. All fresh source labels are retained so taxonomy drift cannot be hidden by the allowlist. Canonical value checks run before hour completeness so invalid billing inputs cannot accumulate an apparently complete slot. Raw sample freshness is checked before recording so Prometheus lookback values cannot be re-timestamped as current billing evidence. Request billing must fail closed."
        - alert: KubeBrainLogicalBackupMetricsMissing
          expr: count(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current) != 1 or count(kubebrain_dbaas:logical_backup_artifact_bytes:current) != 1 or count(kubebrain_dbaas:logical_backup_records:current) != 1 or count(kubebrain_dbaas:logical_backup_leases:current) != 1 or count(kubebrain_dbaas:logical_backup_snapshot_revision:current) != 1 or kubebrain_dbaas:logical_backup_invalid_values:count != 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: KubeBrain logical backup metric family is incomplete or non-unique
            description: "Exactly one timestamp, artifact-bytes, records, leases, and snapshot-revision series is required from the atomically published logical backup metrics file. Every raw scrape sample must be no older than 60 seconds. Values must be exact integers no greater than 2^53; timestamp and snapshot revision must be positive, byte/count values non-negative, and timestamp no more than 5 minutes in the future. Invalid values also block metering completeness. Freshness is checked before recording so Prometheus lookback values cannot be re-timestamped as current evidence. Configure one authoritative METRICS_OUTPUT textfile collector and remove partial, stale, invalid, or duplicate exporters before trusting backup RPO or artifact inventory."
        - alert: KubeBrainLogicalBackupStale
          expr: (time() - max(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current) > 90000) or (max(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current) > time() + 300)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain logical backup timestamp violates the production RPO clock envelope
            description: "The newest reported successful logical backup is more than 25 hours old or over 5 minutes in the future. A future timestamp must not suppress stale-backup detection; verify the authoritative exporter and node clock."
        - alert: KubeBrainResourceMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:compute_replicas:expected) == 1 or absent(kubebrain_dbaas:cpu_usage_sources:count) == 1 or absent(kubebrain_dbaas:cpu_throttled_period_sources:count) == 1 or absent(kubebrain_dbaas:cpu_period_sources:count) == 1 or absent(kubebrain_dbaas:memory_working_set_sources:count) == 1 or absent(kubebrain_dbaas:memory_limit_sources:count) == 1 or absent(kubebrain_dbaas:resource_invalid_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:cpu_usage_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:cpu_throttled_period_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:cpu_period_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:memory_working_set_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:memory_limit_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:resource_invalid_values:count != 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane resource metrics are incomplete
            description: "Deduplicated current KubeBrain/PD/TiKV cAdvisor CPU usage, throttled/total period, memory working-set, or kube-state-metrics memory-limit source counts do not exactly match the current StatefulSet replica expectation; a CPU rate is non-finite, negative, above 2^53, has a non-positive total-period denominator, or reports throttled periods above total periods; a memory byte value is not an exact integer within 2^53 or its limit is non-positive; or an expectation/source recording series is absent. CFS and memory inputs must have samples within 60 seconds. Missing, stale, or invalid numerator/denominator telemetry must not be interpreted as zero resource pressure."
        - alert: KubeBrainDataPlaneMemoryHigh
          expr: (kubebrain_dbaas:memory_working_set_bytes:max_by_container / kubebrain_dbaas:memory_limit_bytes:max_by_container) > 0.9
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain data-plane container memory exceeds 90% of its limit
            description: "Container {{ $labels.container }} in {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."
        - alert: KubeBrainDataPlaneCPUThrottlingHigh
          expr: (kubebrain_dbaas:cpu_throttled_periods_per_second:max_by_container / kubebrain_dbaas:cpu_periods_per_second:max_by_container) > 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane container CPU is heavily throttled
            description: "Container {{ $labels.container }} in {{ $labels.pod }} has {{ $value | humanizePercentage }} CPU periods throttled."
        - alert: KubeBrainNetworkMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:compute_replicas:expected) == 1 or absent(kubebrain_dbaas:network_receive_sources:count) == 1 or absent(kubebrain_dbaas:network_transmit_sources:count) == 1 or absent(kubebrain_dbaas:network_receive_error_sources:count) == 1 or absent(kubebrain_dbaas:network_transmit_error_sources:count) == 1 or absent(kubebrain_dbaas:network_receive_drop_sources:count) == 1 or absent(kubebrain_dbaas:network_transmit_drop_sources:count) == 1 or absent(kubebrain_dbaas:network_invalid_values:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:network_receive_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_transmit_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_receive_error_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_transmit_error_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_receive_drop_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_transmit_drop_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_invalid_values:count != 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network metrics are incomplete
            description: "Deduplicated current KubeBrain/PD/TiKV eth0 receive/transmit byte, error, or packet-drop source counts do not exactly match the current StatefulSet replica expectation; a rate/increase value is NaN, infinite, negative, or above 2^53; or an expectation/source recording series is absent. All inputs must have samples within 60 seconds. Missing, stale, or invalid error/drop families must not be interpreted as zero network faults."
        - alert: KubeBrainNetworkErrors
          expr: (kubebrain_dbaas:network_receive_errors:increase_10m_by_interface + kubebrain_dbaas:network_transmit_errors:increase_10m_by_interface) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network interface errors detected
            description: "Pod {{ $labels.pod }} reported {{ $value }} RX/TX errors on {{ $labels.interface }} in 10 minutes."
        - alert: KubeBrainNetworkPacketDrops
          expr: (kubebrain_dbaas:network_receive_drops:increase_10m_by_interface + kubebrain_dbaas:network_transmit_drops:increase_10m_by_interface) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network packets were dropped
            description: "Pod {{ $labels.pod }} dropped {{ $value }} RX/TX packets on {{ $labels.interface }} in 10 minutes."
