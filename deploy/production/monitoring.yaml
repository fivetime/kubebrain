apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/component: peer
  namespaceSelector:
    matchNames:
      - kubebrain-system
  endpoints:
    - port: info
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-pd
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-tikv
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  groups:
    - name: kubebrain.metering
      interval: 1m
      rules:
        - record: kubebrain_dbaas:cpu_usage_sources:count
          expr: count(rate(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",container="kubebrain",image!=""}[5m])) + count(rate(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_sources:count
          expr: count(container_memory_working_set_bytes{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",container="kubebrain",image!=""}) + count(container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_sources:count
          expr: count(rate(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[5m])) + count(rate(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_sources:count
          expr: count(rate(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[5m])) + count(rate(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_capacity_sources:count
          expr: count(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_available_sources:count
          expr: count(kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_sources:count
          expr: count(kubebrain_logical_backup_artifact_bytes{instance="kubebrain"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_timestamp_sources:count
          expr: count(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="write",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="list",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="read",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="delete",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end_sources:count
          expr: count(kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_data_complete
          expr: (kubebrain_dbaas:object_store_write_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_list_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_read_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_delete_request_sources:count == bool 1) * (kubebrain_dbaas:object_request_period_end_sources:count == bool 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_data_complete
          expr: (kubebrain_dbaas:cpu_usage_sources:count == bool 9) * (kubebrain_dbaas:memory_working_set_sources:count == bool 9) * (kubebrain_dbaas:network_receive_sources:count == bool 9) * (kubebrain_dbaas:network_transmit_sources:count == bool 9) * (kubebrain_dbaas:storage_capacity_sources:count == bool 6) * (kubebrain_dbaas:storage_available_sources:count == bool 6) * (kubebrain_dbaas:logical_backup_artifact_sources:count == bool 1) * (kubebrain_dbaas:logical_backup_timestamp_sources:count == bool 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_cores:sum
          expr: (sum(rate(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",container="kubebrain",image!=""}[5m])) + sum(rate(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:sum
          expr: (sum(container_memory_working_set_bytes{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",container="kubebrain",image!=""}) + sum(container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""})) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes_per_second:sum
          expr: (sum(rate(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[5m])) + sum(rate(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes_per_second:sum
          expr: (sum(rate(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[5m])) + sum(rate(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:sum
          expr: sum(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"}) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:sum
          expr: clamp_min(sum(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"}) - sum(kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"}), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_bytes:last
          expr: max(kubebrain_logical_backup_artifact_bytes{instance="kubebrain"}) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_age_seconds:last
          expr: clamp_min(time() - max(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_hour_complete
          expr: (min_over_time(kubebrain_dbaas:metering_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:metering_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_hour_complete
          expr: (min_over_time(kubebrain_dbaas:object_request_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:object_request_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end:last
          expr: max(kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_core_seconds:hour
          expr: (sum(increase(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",container="kubebrain",image!=""}[1h])) + sum(increase(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:memory_working_set_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes:hour
          expr: (sum(increase(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[1h])) + sum(increase(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes:hour
          expr: (sum(increase(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[1h])) + sum(increase(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_provisioned_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_used_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="write",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="list",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="read",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="delete",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
    - name: kubebrain.availability
      rules:
        - alert: KubeBrainTargetDown
          expr: up{namespace="kubebrain-system",service="kubebrain-peer"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain metrics target is down
            description: "Prometheus cannot scrape {{ $labels.pod }} in kubebrain-system."
        - alert: KubeBrainInsufficientReplicas
          expr: count(up{namespace="kubebrain-system",service="kubebrain-peer"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} KubeBrain replicas are currently scrapeable."
        - alert: KubeBrainReadinessUnavailable
          expr: (kube_statefulset_status_replicas_ready{namespace="kubebrain-system",statefulset="kubebrain"} or on() vector(0)) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain StatefulSet has unavailable replicas
            description: "KubeBrain has {{ $value }} ready StatefulSet replicas."
    - name: kubebrain.etcd_compat
      rules:
        - alert: KubeBrainGrpcErrors
          expr: sum(rate(grpc_server_handled_total{namespace="kubebrain-system",grpc_code=~"Unknown|Internal|DataLoss"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain is returning server-fault gRPC responses
            description: "KubeBrain Unknown/Internal/DataLoss response rate is {{ $value }} requests per second. Expected etcd client errors are excluded."
        - alert: KubeBrainWriteFailures
          expr: sum(rate(write{namespace="kubebrain-system",success="false",errclass=~"deadline|other"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain unexpected or timed-out writes detected
            description: "KubeBrain deadline/unexpected write error rate is {{ $value }} writes per second; retryable failover and client errors are excluded."
        - alert: KubeBrainWatchEventDrops
          expr: sum(rate(watch_event_buffer_stale_drop{namespace="kubebrain-system"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain is dropping watch events
            description: "KubeBrain watch-event drop rate is {{ $value }} events per second (slow/stale watchers lose events)."
        - alert: KubeBrainWatchBufferFull
          expr: sum(rate(watch_event_buffer_full{namespace="kubebrain-system"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain watch event buffer overflow
            description: "KubeBrain watch event buffer overflow rate is {{ $value }} events per second."
        - alert: KubeBrainLeaderElectionFlapping
          expr: sum(increase(leader_election_lost{namespace="kubebrain-system"}[10m])) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain leader election is flapping
            description: "KubeBrain lost leadership {{ $value }} times in the last 10 minutes."
        - alert: KubeBrainRevisionLagHigh
          expr: max(watch_revision_lag{namespace="kubebrain-system"}) > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain watch revision lag is high
            description: "KubeBrain max watch revision lag is {{ $value }} revisions."
        - alert: KubeBrainGrpcLatencyHigh
          expr: histogram_quantile(0.99, sum by (le, grpc_method) (rate(grpc_server_handling_seconds_bucket{namespace="kubebrain-system"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain p99 gRPC latency is high
            description: "KubeBrain p99 gRPC latency for {{ $labels.grpc_method }} is above 1 second."
        - alert: KubeBrainCountIndexOverflowed
          expr: max(count_index_overflowed{namespace="kubebrain-system"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index exceeded its key limit
            description: "The leader count index overflowed and exact counts are falling back to TiKV scans. Increase the instance memory tier and --count-index-max-keys together."
        - alert: KubeBrainCountIndexRebuildFailures
          expr: sum(increase(count_index_rebuild_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index rebuild failed
            description: "A leader count-index rebuild failed in the last 10 minutes; CountOnly requests may be falling back to TiKV scans."
        - alert: KubeBrainQuotaNoSpace
          expr: max(quota_nospace{namespace="kubebrain-system"}) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain tenant quota is blocking growth writes
            description: "A persistent NOSPACE alarm is active. Delete data or revoke leases to reduce logical usage, then disarm the alarm."
        - alert: KubeBrainQuotaUsageHigh
          expr: max(quota_logical_usage_bytes{namespace="kubebrain-system"} / quota_backend_bytes{namespace="kubebrain-system"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain tenant logical quota usage is high
            description: "Logical key/value usage exceeds 90% of the configured tenant quota."
        - alert: KubeBrainQuotaMetricsInconsistent
          expr: count(quota_nospace{namespace="kubebrain-system"}) < 3 or (max(quota_nospace{namespace="kubebrain-system"}) - min(quota_nospace{namespace="kubebrain-system"}) > 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain replicas disagree on tenant quota state
            description: "Quota metric series are missing or replicas have reported different NOSPACE state for more than one refresh interval."
        - alert: KubeBrainQuotaRefreshFailures
          expr: sum(increase(quota_refresh_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain failed to refresh tenant quota metrics
            description: "At least one replica could not read shared quota metadata from TiKV in the last 10 minutes."
    - name: kubebrain.storage
      rules:
        - alert: KubeBrainPDInsufficientReplicas
          expr: count(up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} PD replicas for the KubeBrain storage cluster are currently scrapeable."
        - alert: KubeBrainTiKVInsufficientReplicas
          expr: count(up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} TiKV replicas for the KubeBrain storage cluster are currently scrapeable."
        - alert: KubeBrainPDLeaderUnavailable
          expr: sum(etcd_server_is_leader{namespace="tidb-cluster",service="kb-pd-metrics"}) != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD does not have exactly one leader
            description: "The KubeBrain PD cluster reports {{ $value }} leaders; exactly one is required."
        - alert: KubeBrainTiKVRegionLeaderMissing
          expr: max(tikv_raftstore_leader_missing{namespace="tidb-cluster",service="kb-tikv-metrics"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV has Regions without a leader
            description: "At least one TiKV store reports Regions without a leader."
        - alert: KubeBrainStorageVolumeMetricsMissing
          expr: count(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"}) < 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage volume metrics are incomplete
            description: "Only {{ $value }} of 6 PD/TiKV PVCs expose kubelet capacity metrics. Verify that the production CSI driver implements volume statistics."
        - alert: KubeBrainStorageVolumeLow
          expr: (kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"} / kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-2]"}) < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain storage volume has less than 15% free space
            description: "PVC {{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} free space."
    - name: kubebrain.resources
      rules:
        - alert: KubeBrainMeteringDataIncomplete
          expr: kubebrain_dbaas:metering_data_complete != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain billing inputs are incomplete
            description: "At least one required KubeBrain, PD, TiKV, PVC, or backup metric source is missing. Billing export must fail closed for this interval."
        - alert: KubeBrainObjectRequestMeteringDataIncomplete
          expr: kubebrain_dbaas:object_request_data_complete != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain object request billing inputs are incomplete
            description: "The provider request exporter does not expose exactly one finalized hourly count for every write, list, read, and delete class. Request billing must fail closed."
        - alert: KubeBrainLogicalBackupMetricsMissing
          expr: absent(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: KubeBrain logical backup success metrics are missing
            description: "No logical backup success metric is available. Configure METRICS_OUTPUT for the backup job and a Prometheus textfile collector."
        - alert: KubeBrainLogicalBackupStale
          expr: time() - kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"} > 90000
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain has no recent successful logical backup
            description: "The last successful logical backup is {{ $value | humanizeDuration }} old; the production target is at most 25 hours."
        - alert: KubeBrainResourceMetricsMissing
          expr: ((count(container_memory_working_set_bytes{namespace="kubebrain-system",container="kubebrain",image!=""}) + count(container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""})) < 9) or ((count(kube_pod_container_resource_limits{namespace="kubebrain-system",container="kubebrain",resource="memory",unit="byte"}) + count(kube_pod_container_resource_limits{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",resource="memory",unit="byte"})) < 9)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane resource metrics are incomplete
            description: "Expected cAdvisor usage and kube-state-metrics limit series for all 9 KubeBrain/PD/TiKV containers."
        - alert: KubeBrainDataPlaneMemoryHigh
          expr: ((container_memory_working_set_bytes{namespace="kubebrain-system",container="kubebrain",image!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="kubebrain-system",container="kubebrain",resource="memory",unit="byte"}) > 0.9) or ((container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",resource="memory",unit="byte"}) > 0.9)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain data-plane container memory exceeds 90% of its limit
            description: "Container {{ $labels.container }} in {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."
        - alert: KubeBrainDataPlaneCPUThrottlingHigh
          expr: ((rate(container_cpu_cfs_throttled_periods_total{namespace="kubebrain-system",container="kubebrain",image!=""}[5m]) / rate(container_cpu_cfs_periods_total{namespace="kubebrain-system",container="kubebrain",image!=""}[5m])) > 0.25) or ((rate(container_cpu_cfs_throttled_periods_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""}[5m]) / rate(container_cpu_cfs_periods_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",container=~"pd|tikv",image!=""}[5m])) > 0.25)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane container CPU is heavily throttled
            description: "Container {{ $labels.container }} in {{ $labels.pod }} has {{ $value | humanizePercentage }} CPU periods throttled."
        - alert: KubeBrainNetworkMetricsMissing
          expr: ((count(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}) + count(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"})) < 9) or ((count(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}) + count(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"})) < 9)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network metrics are incomplete
            description: "Expected cAdvisor RX and TX byte counters for all 9 KubeBrain/PD/TiKV pod interfaces."
        - alert: KubeBrainNetworkErrors
          expr: (sum by (namespace, pod, interface) (increase(container_network_receive_errors_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[10m]) + increase(container_network_transmit_errors_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[10m])) > 0) or (sum by (namespace, pod, interface) (increase(container_network_receive_errors_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[10m]) + increase(container_network_transmit_errors_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[10m])) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network interface errors detected
            description: "Pod {{ $labels.pod }} reported {{ $value }} RX/TX errors on {{ $labels.interface }} in 10 minutes."
        - alert: KubeBrainNetworkPacketDrops
          expr: (sum by (namespace, pod, interface) (increase(container_network_receive_packets_dropped_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[10m]) + increase(container_network_transmit_packets_dropped_total{namespace="kubebrain-system",pod=~"kubebrain-[0-2]",interface="eth0"}[10m])) > 0) or (sum by (namespace, pod, interface) (increase(container_network_receive_packets_dropped_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[10m]) + increase(container_network_transmit_packets_dropped_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-2]",interface="eth0"}[10m])) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network packets were dropped
            description: "Pod {{ $labels.pod }} dropped {{ $value }} RX/TX packets on {{ $labels.interface }} in 10 minutes."
