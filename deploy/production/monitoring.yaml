apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/component: peer
  namespaceSelector:
    matchNames:
      - kubebrain-system
  endpoints:
    - port: info
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_uid]
          targetLabel: uid
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-pd
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-tikv
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
