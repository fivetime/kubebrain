      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  groups:
    - name: kubebrain.metering
      interval: 1m
      rules:
        - record: kubebrain_dbaas:statefulset_replicas:current
          expr: max by (namespace, statefulset) (kube_statefulset_replicas{namespace=~"kubebrain-system|tidb-cluster",statefulset=~"kubebrain|kb-(pd|tikv)"} and (time() - timestamp(kube_statefulset_replicas{namespace=~"kubebrain-system|tidb-cluster",statefulset=~"kubebrain|kb-(pd|tikv)"}) <= 60))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:statefulset_ready_replicas:current
          expr: max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace=~"kubebrain-system|tidb-cluster",statefulset=~"kubebrain|kb-(pd|tikv)"} and (time() - timestamp(kube_statefulset_status_replicas_ready{namespace=~"kubebrain-system|tidb-cluster",statefulset=~"kubebrain|kb-(pd|tikv)"}) <= 60))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:statefulset_ready_sources:count
          expr: count(((kubebrain_dbaas:statefulset_ready_replicas:current >= 0) and (kubebrain_dbaas:statefulset_ready_replicas:current <= 9007199254740992) and (kubebrain_dbaas:statefulset_ready_replicas:current == floor(kubebrain_dbaas:statefulset_ready_replicas:current))) and on(namespace, statefulset) (kubebrain_dbaas:statefulset_ready_replicas:current <= kubebrain_dbaas:statefulset_replicas:current))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:ready_pods:current
          expr: max by (namespace, pod, uid) ((kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1) and (time() - timestamp(kube_pod_status_ready{namespace="kubebrain-system",condition="true"}) <= 60))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:serializable_checkpoint_available:current_by_pod
          expr: max by (namespace, pod, uid) (serializable_checkpoint_available{namespace="kubebrain-system"} and (time() - timestamp(serializable_checkpoint_available{namespace="kubebrain-system"}) <= 60))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:serializable_checkpoint_revision:current_by_pod
          expr: max by (namespace, pod, uid) (serializable_checkpoint_revision{namespace="kubebrain-system"} and (time() - timestamp(serializable_checkpoint_revision{namespace="kubebrain-system"}) <= 60))
