          expr: count((kubebrain_dbaas:storage_requested_bytes:max_by_pvc <= 0) or (kubebrain_dbaas:storage_requested_bytes:max_by_pvc > 9007199254740992) or (kubebrain_dbaas:storage_requested_bytes:max_by_pvc != floor(kubebrain_dbaas:storage_requested_bytes:max_by_pvc))) + count((kubebrain_dbaas:storage_capacity_bytes:max_by_pvc <= 0) or (kubebrain_dbaas:storage_capacity_bytes:max_by_pvc > 9007199254740992) or (kubebrain_dbaas:storage_capacity_bytes:max_by_pvc != floor(kubebrain_dbaas:storage_capacity_bytes:max_by_pvc))) + count((kubebrain_dbaas:storage_available_bytes:max_by_pvc < 0) or (kubebrain_dbaas:storage_available_bytes:max_by_pvc > 9007199254740992) or (kubebrain_dbaas:storage_available_bytes:max_by_pvc != floor(kubebrain_dbaas:storage_available_bytes:max_by_pvc))) + count((kubebrain_dbaas:storage_available_bytes:min_by_pvc < 0) or (kubebrain_dbaas:storage_available_bytes:min_by_pvc > 9007199254740992) or (kubebrain_dbaas:storage_available_bytes:min_by_pvc != floor(kubebrain_dbaas:storage_available_bytes:min_by_pvc))) + count(kubebrain_dbaas:storage_available_bytes:max_by_pvc > on(namespace, persistentvolumeclaim) kubebrain_dbaas:storage_capacity_bytes:max_by_pvc) + count(kubebrain_dbaas:storage_capacity_bytes:max_by_pvc < on(namespace, persistentvolumeclaim) kubebrain_dbaas:storage_requested_bytes:max_by_pvc)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current
          expr: kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"} and (time() - timestamp(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_bytes:current
          expr: kubebrain_logical_backup_artifact_bytes{instance="kubebrain"} and (time() - timestamp(kubebrain_logical_backup_artifact_bytes{instance="kubebrain"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_records:current
          expr: kubebrain_logical_backup_records{instance="kubebrain"} and (time() - timestamp(kubebrain_logical_backup_records{instance="kubebrain"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_leases:current
          expr: kubebrain_logical_backup_leases{instance="kubebrain"} and (time() - timestamp(kubebrain_logical_backup_leases{instance="kubebrain"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_snapshot_revision:current
          expr: kubebrain_logical_backup_snapshot_revision{instance="kubebrain"} and (time() - timestamp(kubebrain_logical_backup_snapshot_revision{instance="kubebrain"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_sources:count
          expr: count(kubebrain_dbaas:logical_backup_artifact_bytes:current)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_timestamp_sources:count
          expr: count(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_invalid_values:count
          expr: count((kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current <= 0) or (kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current > 9007199254740992) or (kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current != floor(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current)) or (kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current > time() + 300)) + count((kubebrain_dbaas:logical_backup_artifact_bytes:current < 0) or (kubebrain_dbaas:logical_backup_artifact_bytes:current > 9007199254740992) or (kubebrain_dbaas:logical_backup_artifact_bytes:current != floor(kubebrain_dbaas:logical_backup_artifact_bytes:current))) + count((kubebrain_dbaas:logical_backup_records:current < 0) or (kubebrain_dbaas:logical_backup_records:current > 9007199254740992) or (kubebrain_dbaas:logical_backup_records:current != floor(kubebrain_dbaas:logical_backup_records:current))) + count((kubebrain_dbaas:logical_backup_leases:current < 0) or (kubebrain_dbaas:logical_backup_leases:current > 9007199254740992) or (kubebrain_dbaas:logical_backup_leases:current != floor(kubebrain_dbaas:logical_backup_leases:current))) + count((kubebrain_dbaas:logical_backup_snapshot_revision:current <= 0) or (kubebrain_dbaas:logical_backup_snapshot_revision:current > 9007199254740992) or (kubebrain_dbaas:logical_backup_snapshot_revision:current != floor(kubebrain_dbaas:logical_backup_snapshot_revision:current)))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_request_count:current
          expr: kubebrain_object_store_request_count{dbaas_instance="kubebrain",window="1h"} and (time() - timestamp(kubebrain_object_store_request_count{dbaas_instance="kubebrain",window="1h"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_request_period_end_seconds:current
          expr: kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"} and (time() - timestamp(kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"}) <= 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_request_sources:count
          expr: count(kubebrain_dbaas:object_store_request_count:current{request_class="write"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_request_sources:count
          expr: count(kubebrain_dbaas:object_store_request_count:current{request_class="list"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_request_sources:count
          expr: count(kubebrain_dbaas:object_store_request_count:current{request_class="read"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_request_sources:count
          expr: count(kubebrain_dbaas:object_store_request_count:current{request_class="delete"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end_sources:count
          expr: count(kubebrain_dbaas:object_store_request_period_end_seconds:current) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_unexpected_request_classes:count
          expr: count(kubebrain_dbaas:object_store_request_count:current{request_class!~"write|list|read|delete"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_invalid_request_values:count
          expr: count((kubebrain_dbaas:object_store_request_count:current < 0) or (kubebrain_dbaas:object_store_request_count:current > 9007199254740992) or (kubebrain_dbaas:object_store_request_count:current != floor(kubebrain_dbaas:object_store_request_count:current))) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_invalid_period_end_values:count
          expr: count((kubebrain_dbaas:object_store_request_period_end_seconds:current < 0) or (kubebrain_dbaas:object_store_request_period_end_seconds:current > 9007199254740992) or (kubebrain_dbaas:object_store_request_period_end_seconds:current != floor(kubebrain_dbaas:object_store_request_period_end_seconds:current)) or (kubebrain_dbaas:object_store_request_period_end_seconds:current % 3600 != 0)) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_data_complete
          expr: (kubebrain_dbaas:object_store_write_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_list_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_read_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_delete_request_sources:count == bool 1) * (kubebrain_dbaas:object_request_period_end_sources:count == bool 1) * (kubebrain_dbaas:object_store_unexpected_request_classes:count == bool 0) * (kubebrain_dbaas:object_store_invalid_request_values:count == bool 0) * (kubebrain_dbaas:object_store_invalid_period_end_values:count == bool 0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_data_complete
          expr: (kubebrain_dbaas:replica_expectation_sources:count == bool 3) * (kubebrain_dbaas:cpu_usage_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:memory_working_set_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:network_receive_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:network_transmit_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:metering_invalid_compute_values:count == bool 0) * (kubebrain_dbaas:storage_volumes:expected >= bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_requested_sources:count == bool kubebrain_dbaas:storage_volumes:expected) * (kubebrain_dbaas:storage_volume_identity_mismatches:count == bool 0) * (kubebrain_dbaas:storage_active_volume_sources:count == bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_capacity_sources:count == bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_available_sources:count == bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_volume_stats_identity_mismatches:count == bool 0) * (kubebrain_dbaas:storage_invalid_byte_values:count == bool 0) * (kubebrain_dbaas:logical_backup_artifact_sources:count == bool 1) * (kubebrain_dbaas:logical_backup_timestamp_sources:count == bool 1) * (kubebrain_dbaas:logical_backup_invalid_values:count == bool 0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_cores:sum
          expr: sum(kubebrain_dbaas:cpu_usage_cores:max_by_container) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:sum
          expr: sum(kubebrain_dbaas:memory_working_set_bytes:max_by_container) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes_per_second:sum
          expr: sum(kubebrain_dbaas:network_receive_bytes_per_second:max_by_interface) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes_per_second:sum
          expr: sum(kubebrain_dbaas:network_transmit_bytes_per_second:max_by_interface) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:sum
          expr: sum(kubebrain_dbaas:storage_requested_bytes:max_by_pvc) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:sum
          expr: clamp_min(sum(kubebrain_dbaas:storage_capacity_bytes:max_by_pvc) - sum(kubebrain_dbaas:storage_available_bytes:max_by_pvc), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_bytes:last
          expr: max(kubebrain_dbaas:logical_backup_artifact_bytes:current) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_age_seconds:last
          expr: clamp_min(time() - max(kubebrain_dbaas:logical_backup_last_success_timestamp_seconds:current), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_hour_complete
          expr: (min_over_time(kubebrain_dbaas:metering_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:metering_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_hour_complete
          expr: (min_over_time(kubebrain_dbaas:object_request_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:object_request_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end:last
          expr: max(kubebrain_dbaas:object_store_request_period_end_seconds:current) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_core_seconds:hour
          expr: (sum(max by (namespace, pod, container) (increase(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}[1h]))) + sum(max by (namespace, pod, container) (increase(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[1h])))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:memory_working_set_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes:hour
          expr: (sum(max by (namespace, pod, interface) (increase(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[1h]))) + sum(max by (namespace, pod, interface) (increase(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[1h])))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes:hour
          expr: (sum(max by (namespace, pod, interface) (increase(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[1h]))) + sum(max by (namespace, pod, interface) (increase(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[1h])))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_provisioned_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_used_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_requests:hour
          expr: sum(kubebrain_dbaas:object_store_request_count:current{request_class="write"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_requests:hour
          expr: sum(kubebrain_dbaas:object_store_request_count:current{request_class="list"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_requests:hour
          expr: sum(kubebrain_dbaas:object_store_request_count:current{request_class="read"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_requests:hour
          expr: sum(kubebrain_dbaas:object_store_request_count:current{request_class="delete"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
    - name: kubebrain.availability
      rules:
        - alert: KubeBrainTargetDown
          expr: up{namespace="kubebrain-system",service="kubebrain-peer"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain metrics target is down
            description: "Prometheus cannot scrape {{ $labels.pod }} in kubebrain-system."
        - alert: KubeBrainInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:kubebrain_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:kubebrain_replicas:expected < 3 or count(max by (instance) (up{namespace="kubebrain-system",service="kubebrain-peer"} == 1)) != on() kubebrain_dbaas:kubebrain_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain scrapeable replicas do not match the required topology
            description: "The KubeBrain StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent or contains a negative, fractional, non-finite, or greater-than-2^53 replica count."
        - alert: KubeBrainReadinessUnavailable
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:statefulset_ready_sources:count) == 1 or absent(kubebrain_dbaas:kubebrain_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:statefulset_ready_sources:count != 3 or kubebrain_dbaas:kubebrain_replicas:expected < 3 or (sum(kubebrain_dbaas:statefulset_ready_replicas:current{namespace="kubebrain-system",statefulset="kubebrain"}) or on() vector(0)) != on() kubebrain_dbaas:kubebrain_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain Ready replicas do not match the required topology
            description: "The KubeBrain StatefulSet expects fewer than the production minimum of 3 replicas, fresh deduplicated Ready replicas do not exactly match the current expected replica count, a Ready count exceeds desired, or the desired/Ready expectation chain is absent or contains a negative, fractional, non-finite, or greater-than-2^53 count. Ready inputs must have samples within 60 seconds."
        - alert: KubeBrainTransactionPathUnavailableWithHealthyTiKVControlPlane
          expr: ((sum(kubebrain_dbaas:statefulset_ready_replicas:current{namespace="kubebrain-system",statefulset="kubebrain"}) or on() vector(0)) == 0) and on() (kubebrain_dbaas:replica_expectation_sources:count == 3) and on() (kubebrain_dbaas:statefulset_ready_sources:count == 3) and on() (kubebrain_dbaas:pd_replicas:expected >= 3) and on() (kubebrain_dbaas:tikv_replicas:expected >= 3) and on() (count(max by (instance) (up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1)) == on() kubebrain_dbaas:pd_replicas:expected) and on() (count(max by (instance) (up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1)) == on() kubebrain_dbaas:tikv_replicas:expected) and on() (kubebrain_dbaas:storage_control_plane_invalid_values:count == 0) and on() (sum(kubebrain_dbaas:pd_is_leader:max_by_instance) == 1) and on() (count(kubebrain_dbaas:pd_region_status:max_by_instance_type) == on() (2 * kubebrain_dbaas:pd_replicas:expected)) and on() (max(kubebrain_dbaas:tikv_leader_missing:max_by_instance) == 0) and on() (max(kubebrain_dbaas:pd_region_status:max_by_instance_type) == 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain transaction path is unavailable while TiKV control-plane signals remain healthy
            description: "Fresh desired/Ready StatefulSet telemetry proves all KubeBrain replicas are NotReady while the complete current PD/TiKV topology is scrapeable, all leader/Region gauges have valid integer values, PD reports exactly one leader, complete Region-peer telemetry, and no pending/down peer Regions, and TiKV reports no missing Region leaders. Treat TCP, PD heartbeat, and Debug RPC as insufficient; run an end-to-end etcd transaction probe and follow the fenced same-PVC TiKV repair procedure."
    - name: kubebrain.etcd_compat
      rules:
        - alert: KubeBrainGrpcErrors
          expr: sum(rate(grpc_server_handled_total{namespace="kubebrain-system",grpc_code=~"Unknown|Internal|DataLoss"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain is returning server-fault gRPC responses
            description: "KubeBrain Unknown/Internal/DataLoss response rate is {{ $value }} requests per second. Expected etcd client errors are excluded."
        - alert: KubeBrainWriteFailures
          expr: sum(rate(write{namespace="kubebrain-system",success="false",errclass=~"deadline|other"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain unexpected or timed-out writes detected
            description: "KubeBrain deadline/unexpected write error rate is {{ $value }} writes per second; retryable failover and client errors are excluded."
        - alert: KubeBrainWatchEventDrops
          expr: sum(kubebrain_dbaas:watch_event_buffer_stale_drop:rate_5m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain is dropping watch events
            description: "KubeBrain watch-event drop rate is {{ $value }} events per second (slow/stale watchers lose events)."
        - alert: KubeBrainWatchBufferFull
          expr: sum(kubebrain_dbaas:watch_event_buffer_full:rate_5m_by_pod * on(namespace, pod, uid) group_left() kubebrain_dbaas:ready_pods:current) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain watch event buffer overflow
            description: "KubeBrain watch event buffer overflow rate is {{ $value }} events per second."
        - alert: KubeBrainWatchEventBufferMetricsMissing
