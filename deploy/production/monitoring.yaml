apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/component: peer
  namespaceSelector:
    matchNames:
      - kubebrain-system
  endpoints:
    - port: info
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-pd
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-tikv
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  groups:
    - name: kubebrain.availability
      rules:
        - alert: KubeBrainTargetDown
          expr: up{namespace="kubebrain-system",service="kubebrain-peer"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain metrics target is down
            description: "Prometheus cannot scrape {{ $labels.pod }} in kubebrain-system."
        - alert: KubeBrainInsufficientReplicas
          expr: count(up{namespace="kubebrain-system",service="kubebrain-peer"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} KubeBrain replicas are currently scrapeable."
        - alert: KubeBrainReadinessUnavailable
          expr: (kube_statefulset_status_replicas_ready{namespace="kubebrain-system",statefulset="kubebrain"} or on() vector(0)) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain StatefulSet has unavailable replicas
            description: "KubeBrain has {{ $value }} ready StatefulSet replicas."
    - name: kubebrain.etcd_compat
      rules:
        - alert: KubeBrainGrpcErrors
          expr: sum(rate(grpc_server_handled_total{namespace="kubebrain-system",grpc_code=~"Unknown|Internal|DataLoss"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain is returning server-fault gRPC responses
            description: "KubeBrain Unknown/Internal/DataLoss response rate is {{ $value }} requests per second. Expected etcd client errors are excluded."
        - alert: KubeBrainWriteFailures
          expr: sum(rate(write{namespace="kubebrain-system",success="false",errclass=~"deadline|other"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain unexpected or timed-out writes detected
            description: "KubeBrain deadline/unexpected write error rate is {{ $value }} writes per second; retryable failover and client errors are excluded."
        - alert: KubeBrainWatchEventDrops
          expr: sum(rate(watch_event_buffer_stale_drop{namespace="kubebrain-system"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain is dropping watch events
            description: "KubeBrain watch-event drop rate is {{ $value }} events per second (slow/stale watchers lose events)."
        - alert: KubeBrainWatchBufferFull
          expr: sum(rate(watch_event_buffer_full{namespace="kubebrain-system"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain watch event buffer overflow
            description: "KubeBrain watch event buffer overflow rate is {{ $value }} events per second."
        - alert: KubeBrainLeaderElectionFlapping
          expr: sum(increase(leader_election_lost{namespace="kubebrain-system"}[10m])) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain leader election is flapping
            description: "KubeBrain lost leadership {{ $value }} times in the last 10 minutes."
        - alert: KubeBrainRevisionLagHigh
          expr: max(watch_revision_lag{namespace="kubebrain-system"}) > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain watch revision lag is high
            description: "KubeBrain max watch revision lag is {{ $value }} revisions."
        - alert: KubeBrainGrpcLatencyHigh
          expr: histogram_quantile(0.99, sum by (le, grpc_method) (rate(grpc_server_handling_seconds_bucket{namespace="kubebrain-system"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain p99 gRPC latency is high
            description: "KubeBrain p99 gRPC latency for {{ $labels.grpc_method }} is above 1 second."
        - alert: KubeBrainCountIndexOverflowed
          expr: max(count_index_overflowed{namespace="kubebrain-system"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index exceeded its key limit
            description: "The leader count index overflowed and exact counts are falling back to TiKV scans. Increase the instance memory tier and --count-index-max-keys together."
        - alert: KubeBrainCountIndexRebuildFailures
          expr: sum(increase(count_index_rebuild_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index rebuild failed
            description: "A leader count-index rebuild failed in the last 10 minutes; CountOnly requests may be falling back to TiKV scans."
    - name: kubebrain.storage
      rules:
        - alert: KubeBrainPDInsufficientReplicas
          expr: count(up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} PD replicas for the KubeBrain storage cluster are currently scrapeable."
        - alert: KubeBrainTiKVInsufficientReplicas
          expr: count(up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV has fewer than 3 scrapeable replicas
            description: "Only {{ $value }} TiKV replicas for the KubeBrain storage cluster are currently scrapeable."
        - alert: KubeBrainPDLeaderUnavailable
          expr: sum(etcd_server_is_leader{namespace="tidb-cluster",service="kb-pd-metrics"}) != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD does not have exactly one leader
            description: "The KubeBrain PD cluster reports {{ $value }} leaders; exactly one is required."
        - alert: KubeBrainTiKVRegionLeaderMissing
          expr: max(tikv_raftstore_leader_missing{namespace="tidb-cluster",service="kb-tikv-metrics"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV has Regions without a leader
            description: "At least one TiKV store reports Regions without a leader."
