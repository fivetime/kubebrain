apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
      app.kubernetes.io/component: peer
  namespaceSelector:
    matchNames:
      - kubebrain-system
  endpoints:
    - port: info
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_uid]
          targetLabel: uid
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-pd
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: pd
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubebrain-tikv
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tidb-cluster
      app.kubernetes.io/instance: kb
      app.kubernetes.io/component: tikv
      app.kubernetes.io/part-of: kubebrain
  namespaceSelector:
    matchNames:
      - tidb-cluster
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  groups:
    - name: kubebrain.metering
      interval: 1m
      rules:
        - record: kubebrain_dbaas:replica_expectation_sources:count
          expr: count(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="kubebrain-system",statefulset="kubebrain"})) + count(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="tidb-cluster",statefulset=~"kb-(pd|tikv)"}))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:compute_replicas:expected
          expr: (sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="kubebrain-system",statefulset="kubebrain"})) or on() vector(0)) + (sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="tidb-cluster",statefulset=~"kb-(pd|tikv)"})) or on() vector(0))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:kubebrain_replicas:expected
          expr: sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="kubebrain-system",statefulset="kubebrain"})) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_replicas:expected
          expr: sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="tidb-cluster",statefulset=~"kb-(pd|tikv)"})) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_volumes:expected
          expr: count(max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_info{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"}))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_requested_sources:count
          expr: count(max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"}))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:pd_replicas:expected
          expr: sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="tidb-cluster",statefulset="kb-pd"})) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:tikv_replicas:expected
          expr: sum(max by (namespace, statefulset) (kube_statefulset_replicas{namespace="tidb-cluster",statefulset="kb-tikv"})) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_sources:count
          expr: count(rate(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}[5m])) + count(rate(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_sources:count
          expr: count(container_memory_working_set_bytes{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}) + count(container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_sources:count
          expr: count(rate(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[5m])) + count(rate(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_sources:count
          expr: count(rate(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[5m])) + count(rate(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[5m]))
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_capacity_sources:count
          expr: count(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_available_sources:count
          expr: count(kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_sources:count
          expr: count(kubebrain_logical_backup_artifact_bytes{instance="kubebrain"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_timestamp_sources:count
          expr: count(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"})
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="write",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="list",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="read",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_request_sources:count
          expr: count(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="delete",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end_sources:count
          expr: count(kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"}) or on() vector(0)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_data_complete
          expr: (kubebrain_dbaas:object_store_write_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_list_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_read_request_sources:count == bool 1) * (kubebrain_dbaas:object_store_delete_request_sources:count == bool 1) * (kubebrain_dbaas:object_request_period_end_sources:count == bool 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_data_complete
          expr: (kubebrain_dbaas:replica_expectation_sources:count == bool 3) * (kubebrain_dbaas:cpu_usage_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:memory_working_set_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:network_receive_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:network_transmit_sources:count == bool kubebrain_dbaas:compute_replicas:expected) * (kubebrain_dbaas:storage_volumes:expected >= bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_requested_sources:count == bool kubebrain_dbaas:storage_volumes:expected) * (kubebrain_dbaas:storage_capacity_sources:count == bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:storage_available_sources:count == bool kubebrain_dbaas:storage_replicas:expected) * (kubebrain_dbaas:logical_backup_artifact_sources:count == bool 1) * (kubebrain_dbaas:logical_backup_timestamp_sources:count == bool 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_cores:sum
          expr: (sum(rate(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}[5m])) + sum(rate(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:sum
          expr: (sum(container_memory_working_set_bytes{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}) + sum(container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""})) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes_per_second:sum
          expr: (sum(rate(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[5m])) + sum(rate(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes_per_second:sum
          expr: (sum(rate(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[5m])) + sum(rate(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[5m]))) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:sum
          expr: sum(max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"})) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:sum
          expr: clamp_min(sum(kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"}) - sum(kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"}), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_artifact_bytes:last
          expr: max(kubebrain_logical_backup_artifact_bytes{instance="kubebrain"}) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:logical_backup_age_seconds:last
          expr: clamp_min(time() - max(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}), 0) and on() (kubebrain_dbaas:metering_data_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:metering_hour_complete
          expr: (min_over_time(kubebrain_dbaas:metering_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:metering_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_hour_complete
          expr: (min_over_time(kubebrain_dbaas:object_request_data_complete[1h]) == 1) * (count_over_time(kubebrain_dbaas:object_request_data_complete[1h]) >= bool 60)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_request_period_end:last
          expr: max(kubebrain_object_store_request_period_end_seconds{dbaas_instance="kubebrain",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:cpu_usage_core_seconds:hour
          expr: (sum(increase(container_cpu_usage_seconds_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",image!=""}[1h])) + sum(increase(container_cpu_usage_seconds_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:memory_working_set_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:memory_working_set_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_receive_bytes:hour
          expr: (sum(increase(container_network_receive_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[1h])) + sum(increase(container_network_receive_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:network_transmit_bytes:hour
          expr: (sum(increase(container_network_transmit_bytes_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[1h])) + sum(increase(container_network_transmit_bytes_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[1h]))) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_provisioned_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_provisioned_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:storage_used_bytes:hour_avg
          expr: avg_over_time(kubebrain_dbaas:storage_used_bytes:sum[1h]) and on() (kubebrain_dbaas:metering_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_write_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="write",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_list_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="list",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_read_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="read",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
        - record: kubebrain_dbaas:object_store_delete_requests:hour
          expr: sum(kubebrain_object_store_request_count{dbaas_instance="kubebrain",request_class="delete",window="1h"}) and on() (kubebrain_dbaas:object_request_hour_complete == 1)
          labels:
            dbaas_instance: kubebrain
    - name: kubebrain.availability
      rules:
        - alert: KubeBrainTargetDown
          expr: up{namespace="kubebrain-system",service="kubebrain-peer"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain metrics target is down
            description: "Prometheus cannot scrape {{ $labels.pod }} in kubebrain-system."
        - alert: KubeBrainInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:kubebrain_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:kubebrain_replicas:expected < 3 or count(max by (instance) (up{namespace="kubebrain-system",service="kubebrain-peer"} == 1)) != on() kubebrain_dbaas:kubebrain_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain scrapeable replicas do not match the required topology
            description: "The KubeBrain StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent."
        - alert: KubeBrainReadinessUnavailable
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:kubebrain_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:kubebrain_replicas:expected < 3 or (max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace="kubebrain-system",statefulset="kubebrain"}) or on() vector(0)) != on() kubebrain_dbaas:kubebrain_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain Ready replicas do not match the required topology
            description: "The KubeBrain StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated Ready replicas do not exactly match the current expected replica count, or the expectation chain is absent."
        - alert: KubeBrainTransactionPathUnavailableWithHealthyTiKVControlPlane
          expr: ((max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace="kubebrain-system",statefulset="kubebrain"}) or on() vector(0)) == 0) and on() (kubebrain_dbaas:replica_expectation_sources:count == 3) and on() (kubebrain_dbaas:pd_replicas:expected >= 3) and on() (kubebrain_dbaas:tikv_replicas:expected >= 3) and on() (count(max by (instance) (up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1)) == on() kubebrain_dbaas:pd_replicas:expected) and on() (count(max by (instance) (up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1)) == on() kubebrain_dbaas:tikv_replicas:expected) and on() (sum(max by (instance) (etcd_server_is_leader{namespace="tidb-cluster",service="kb-pd-metrics"})) == 1) and on() (count(max by (instance, type) (pd_regions_status{namespace="tidb-cluster",service="kb-pd-metrics",type=~"pending-peer-region-count|down-peer-region-count"})) == on() (2 * kubebrain_dbaas:pd_replicas:expected)) and on() (max(tikv_raftstore_leader_missing{namespace="tidb-cluster",service="kb-tikv-metrics"}) == 0) and on() (max(pd_regions_status{namespace="tidb-cluster",service="kb-pd-metrics",type=~"pending-peer-region-count|down-peer-region-count"}) == 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain transaction path is unavailable while TiKV control-plane signals remain healthy
            description: "All KubeBrain replicas are NotReady although the complete current PD/TiKV topology is scrapeable, PD reports exactly one leader, complete Region-peer telemetry, and no pending/down peer Regions, and TiKV reports no missing Region leaders. Treat TCP, PD heartbeat, and Debug RPC as insufficient; run an end-to-end etcd transaction probe and follow the fenced same-PVC TiKV repair procedure."
    - name: kubebrain.etcd_compat
      rules:
        - alert: KubeBrainGrpcErrors
          expr: sum(rate(grpc_server_handled_total{namespace="kubebrain-system",grpc_code=~"Unknown|Internal|DataLoss"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain is returning server-fault gRPC responses
            description: "KubeBrain Unknown/Internal/DataLoss response rate is {{ $value }} requests per second. Expected etcd client errors are excluded."
        - alert: KubeBrainWriteFailures
          expr: sum(rate(write{namespace="kubebrain-system",success="false",errclass=~"deadline|other"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain unexpected or timed-out writes detected
            description: "KubeBrain deadline/unexpected write error rate is {{ $value }} writes per second; retryable failover and client errors are excluded."
        - alert: KubeBrainWatchEventDrops
          expr: sum(rate(watch_event_buffer_stale_drop{namespace="kubebrain-system"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain is dropping watch events
            description: "KubeBrain watch-event drop rate is {{ $value }} events per second (slow/stale watchers lose events)."
        - alert: KubeBrainWatchBufferFull
          expr: sum(rate(watch_event_buffer_full{namespace="kubebrain-system"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain watch event buffer overflow
            description: "KubeBrain watch event buffer overflow rate is {{ $value }} events per second."
        - alert: KubeBrainLeaderElectionFlapping
          expr: sum(increase(leader_election_lost{namespace="kubebrain-system"}[10m])) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain leader election is flapping
            description: "KubeBrain lost leadership {{ $value }} times in the last 10 minutes."
        - alert: KubeBrainIncompatibleTransactionWitness
          expr: sum(increase(leader_election_initialize_incompatible_witness{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain binary cannot read durable transaction witnesses
            description: "A KubeBrain replica rejected leadership because TiKV contains a newer transaction-witness format. Continue roll-forward; do not delete witness metadata or repair TiKV."
        - alert: KubeBrainInvalidCorruptAlarmMetadata
          expr: sum(increase(leader_election_initialize_invalid_alarm_metadata{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain rejected leadership due to invalid alarm metadata
            description: "A KubeBrain replica found malformed CORRUPT member/generation metadata in TiKV and refused leadership. Keep traffic fenced; do not clear or rewrite internal alarm keys. Preserve evidence and follow the corruption-repair runbook."
        - alert: KubeBrainRevisionLagHigh
          expr: max(watch_revision_lag{namespace="kubebrain-system"}) > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain watch revision lag is high
            description: "KubeBrain max watch revision lag is {{ $value }} revisions."
        - alert: KubeBrainGrpcLatencyHigh
          expr: histogram_quantile(0.99, sum by (le, grpc_method) (rate(grpc_server_handling_seconds_bucket{namespace="kubebrain-system"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain p99 gRPC latency is high
            description: "KubeBrain p99 gRPC latency for {{ $labels.grpc_method }} is above 1 second."
        - alert: KubeBrainCountIndexOverflowed
          expr: max(count_index_overflowed{namespace="kubebrain-system"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index exceeded its key limit
            description: "The leader count index overflowed and exact counts are falling back to TiKV scans. Increase the instance memory tier and --count-index-max-keys together."
        - alert: KubeBrainCountIndexRebuildFailures
          expr: sum(increase(count_index_rebuild_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain count index rebuild failed
            description: "A leader count-index rebuild failed in the last 10 minutes; CountOnly requests may be falling back to TiKV scans."
        - alert: KubeBrainSerializableCheckpointUnavailable
          expr: count(serializable_checkpoint_available{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or count(serializable_checkpoint_revision{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or count(serializable_checkpoint_remaining_seconds{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or min(serializable_checkpoint_available{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) < 1 or min(serializable_checkpoint_revision{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) <= 0 or min(serializable_checkpoint_remaining_seconds{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) < 60 or max((time() - timestamp(serializable_checkpoint_available{namespace="kubebrain-system"})) and on(namespace, pod, uid) (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 60 or max((time() - timestamp(serializable_checkpoint_revision{namespace="kubebrain-system"})) and on(namespace, pod, uid) (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 60 or max((time() - timestamp(serializable_checkpoint_remaining_seconds{namespace="kubebrain-system"})) and on(namespace, pod, uid) (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 60
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: KubeBrain serializable checkpoint is unavailable
            description: "At least one current Ready KubeBrain replica lacks a fresh positive-revision GC-protected checkpoint, has less than 60 seconds left in its local safety window, or stopped publishing any of the available, revision, and remaining-seconds checkpoint gauges for 60 seconds, so bounded PD-isolated serializable Range, read-only Txn, and RangeStream service is unavailable or at risk. Expected telemetry follows the Ready Pod UID count during scaling. Check scrape health, PD service GC safepoints, Region/store directory warmup, and checkpoint refresh errors."
        - alert: KubeBrainSerializableCheckpointRefreshFailures
          expr: sum(increase(serializable_checkpoint_refresh_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain serializable checkpoint refresh failed
            description: "KubeBrain failed to create, load, protect, or warm a serializable checkpoint. Existing snapshots remain usable only until serializable_checkpoint_remaining_seconds reaches zero."
        - alert: KubeBrainHealthCheckpointFallback
          expr: sum by (check) (increase(health_checkpoint_fallback{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain health probe used a protected checkpoint
            description: "KubeBrain {{ $labels.check }} health checks entered checkpoint fallback {{ $value }} times in 10 minutes. A successful liveness response is bounded-stale degraded service, not proof that PD/TiKV recovered. Inspect PD/TiKV quorum, serializable checkpoint lifetime, and refresh errors."
        - alert: KubeBrainHealthCheckpointFallbackMetricsMissing
          expr: count(health_checkpoint_fallback{namespace="kubebrain-system",check=~"alarm|serializable_read|data_corruption"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != 3 * count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain health fallback metrics are incomplete
            description: "At least one Ready KubeBrain replica does not expose exactly three initialized health_checkpoint_fallback series. The expected series count follows the current Ready replica count, including during scaling. Check for mixed binary versions, missing pod UID relabeling, stale scrape targets, or an incomplete metrics registry before trusting the fallback alert."
        - alert: KubeBrainQuotaNoSpace
          expr: max(quota_nospace{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain tenant quota is blocking growth writes
            description: "A persistent NOSPACE alarm is active. Delete data or revoke leases to reduce logical usage, then disarm the alarm."
        - alert: KubeBrainQuotaUsageHigh
          expr: max((quota_logical_usage_bytes{namespace="kubebrain-system"} / quota_backend_bytes{namespace="kubebrain-system"}) * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain tenant logical quota usage is high
            description: "Logical key/value usage exceeds 90% of the configured tenant quota."
        - alert: KubeBrainQuotaMetricsInconsistent
          expr: count(quota_nospace{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or count(quota_backend_bytes{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or count(quota_logical_usage_bytes{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) != count(max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1)) or (max(quota_nospace{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) - min(quota_nospace{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 0) or (max(quota_backend_bytes{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) - min(quota_backend_bytes{namespace="kubebrain-system"} * on(namespace, pod, uid) group_left() (max by (namespace, pod, uid) (kube_pod_status_ready{namespace="kubebrain-system",condition="true"} == 1))) > 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain replicas disagree on tenant quota state
            description: "Quota metric series are missing or duplicated for current Ready replicas, or Ready replicas have reported different configured quota/NOSPACE state for more than one refresh interval. Expected telemetry follows the Ready Pod UID count during scaling; stale Pod samples are excluded."
        - alert: KubeBrainQuotaRefreshFailures
          expr: sum(increase(quota_refresh_err{namespace="kubebrain-system"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain failed to refresh tenant quota metrics
            description: "At least one replica could not read shared quota metadata from TiKV in the last 10 minutes."
    - name: kubebrain.storage
      rules:
        - alert: KubeBrainPDInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:pd_replicas:expected < 3 or count(max by (instance) (up{namespace="tidb-cluster",service="kb-pd-metrics"} == 1)) != on() kubebrain_dbaas:pd_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD scrapeable replicas do not match the required topology
            description: "The PD StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent."
        - alert: KubeBrainTiKVInsufficientReplicas
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:tikv_replicas:expected < 3 or count(max by (instance) (up{namespace="tidb-cluster",service="kb-tikv-metrics"} == 1)) != on() kubebrain_dbaas:tikv_replicas:expected
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV scrapeable replicas do not match the required topology
            description: "The TiKV StatefulSet expects fewer than the production minimum of 3 replicas, deduplicated scrapeable targets do not exactly match the current expected replica count, or the expectation chain is absent."
        - alert: KubeBrainPDLeaderUnavailable
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or count(max by (instance) (etcd_server_is_leader{namespace="tidb-cluster",service="kb-pd-metrics"})) != on() kubebrain_dbaas:pd_replicas:expected or sum(max by (instance) (etcd_server_is_leader{namespace="tidb-cluster",service="kb-pd-metrics"})) != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD leader telemetry is incomplete or does not report exactly one leader
            description: "Deduplicated PD leader gauges do not cover every current PD replica, the expectation chain is absent, or the cluster does not report exactly one leader."
        - alert: KubeBrainTiKVRegionLeaderMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or count(max by (instance) (tikv_raftstore_leader_missing{namespace="tidb-cluster",service="kb-tikv-metrics"})) != on() kubebrain_dbaas:tikv_replicas:expected or max(tikv_raftstore_leader_missing{namespace="tidb-cluster",service="kb-tikv-metrics"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV Region leader telemetry is incomplete or reports missing leaders
            description: "Deduplicated TiKV leader-missing gauges do not cover every current TiKV replica, the expectation chain is absent, or at least one store reports Regions without a leader."
        - alert: KubeBrainPDRegionPeerUnhealthy
          expr: max by (type) (pd_regions_status{namespace="tidb-cluster",service="kb-pd-metrics",type=~"pending-peer-region-count|down-peer-region-count"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD reports persistent unhealthy Region peers
            description: "PD has {{ $value }} Regions in {{ $labels.type }}. Run validate-tikv-region-health.sh and inspect the reported Region/store identities before any repair."
        - alert: KubeBrainPDRegionHealthMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or count(max by (instance, type) (pd_regions_status{namespace="tidb-cluster",service="kb-pd-metrics",type=~"pending-peer-region-count|down-peer-region-count"})) != on() (2 * kubebrain_dbaas:pd_replicas:expected)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain PD Region health metrics are incomplete
            description: "Deduplicated pending/down peer Region gauge sources do not exactly equal two series per current PD StatefulSet replica, or the replica expectation chain is absent."
        - alert: KubeBrainPDWALFsyncLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{namespace="tidb-cluster",service="kb-pd-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain PD WAL fsync latency threatens leader availability
            description: "PD {{ $labels.instance }} WAL fsync p99 is {{ $value }}s, above the 1s storage SLO. This can delay Raft heartbeats and expire the PD leader lease before replica-count or Region-health alerts fire."
        - alert: KubeBrainTiKVRaftDBWriteLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(tikv_raftstore_store_write_raftdb_duration_seconds_bucket{namespace="tidb-cluster",service="kb-tikv-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV RaftDB write latency is high
            description: "TiKV {{ $labels.instance }} RaftDB write p99 is {{ $value }}s, above the 1s storage SLO. Short etcd leases and mutation availability are at risk even if all stores remain Up."
        - alert: KubeBrainTiKVKVDBWriteLatencyHigh
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(tikv_raftstore_store_write_kvdb_duration_seconds_bucket{namespace="tidb-cluster",service="kb-tikv-metrics"}[5m]))) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain TiKV KVDB write latency is high
            description: "TiKV {{ $labels.instance }} KVDB write p99 is {{ $value }}s, above the 1s storage SLO. Treat the instance as outside its short-lease availability envelope."
        - alert: KubeBrainStorageLatencyMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:pd_replicas:expected) == 1 or absent(kubebrain_dbaas:tikv_replicas:expected) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or count(max by (instance) (etcd_disk_wal_fsync_duration_seconds_count{namespace="tidb-cluster",service="kb-pd-metrics"})) != on() kubebrain_dbaas:pd_replicas:expected or count(max by (instance) (tikv_raftstore_store_write_raftdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"})) != on() kubebrain_dbaas:tikv_replicas:expected or count(max by (instance) (tikv_raftstore_store_write_kvdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"})) != on() kubebrain_dbaas:tikv_replicas:expected
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage latency telemetry is incomplete
            description: "Deduplicated PD WAL and TiKV RaftDB/KVDB write histogram source counts do not exactly match the current PD/TiKV StatefulSet replica expectations, or an expectation recording series is absent. Do not declare the short-lease storage SLO healthy while any family is missing."
        - alert: KubeBrainStorageLatencyMetricsStale
          expr: (max(time() - max by (instance) (timestamp(etcd_disk_wal_fsync_duration_seconds_count{namespace="tidb-cluster",service="kb-pd-metrics"}))) > 60) or (max(time() - max by (instance) (timestamp(tikv_raftstore_store_write_raftdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"}))) > 60) or (max(time() - max by (instance) (timestamp(tikv_raftstore_store_write_kvdb_duration_seconds_count{namespace="tidb-cluster",service="kb-tikv-metrics"}))) > 60)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage latency telemetry is stale
            description: "At least one PD WAL or TiKV RaftDB/KVDB instance has no fresh histogram sample from any HA scrape replica for more than 60 seconds. Per-instance freshness uses the newest duplicate sample; Prometheus lookback may still expose older replicas and must not create a false stale alert."
        - alert: KubeBrainStorageVolumeMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:storage_replicas:expected) == 1 or absent(kubebrain_dbaas:storage_volumes:expected) == 1 or absent(kubebrain_dbaas:storage_requested_sources:count) == 1 or absent(kubebrain_dbaas:storage_capacity_sources:count) == 1 or absent(kubebrain_dbaas:storage_available_sources:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:storage_volumes:expected < on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_requested_sources:count != on() kubebrain_dbaas:storage_volumes:expected or kubebrain_dbaas:storage_capacity_sources:count != on() kubebrain_dbaas:storage_replicas:expected or kubebrain_dbaas:storage_available_sources:count != on() kubebrain_dbaas:storage_replicas:expected
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain storage volume metrics are incomplete
            description: "KSM requested-storage sources do not exactly cover every current matching PD/TiKV PVC object, kubelet capacity/available sources do not exactly cover active storage replicas, fewer PVC objects exist than active replicas, or an expectation/source recording series is absent. Retained scale-down PVCs remain provisioned and billable until deletion even when unmounted. Verify kube-state-metrics and that the production CSI driver implements volume statistics."
        - alert: KubeBrainStorageVolumeLow
          expr: (kubelet_volume_stats_available_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"} / kubelet_volume_stats_capacity_bytes{namespace="tidb-cluster",persistentvolumeclaim=~"(pd-kb-pd|tikv-kb-tikv)-[0-9]+"}) < 0.15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain storage volume has less than 15% free space
            description: "PVC {{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} free space."
    - name: kubebrain.resources
      rules:
        - alert: KubeBrainMeteringDataIncomplete
          expr: (kubebrain_dbaas:metering_data_complete or on() vector(0)) != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain billing inputs are incomplete
            description: "KubeBrain, PD, TiKV, or PVC metric source counts do not exactly match the current deduplicated StatefulSet replica expectations, a replica expectation is missing, a required backup source is not unique, or the completeness recording series itself is absent. Billing export must fail closed for this interval, including during incomplete scaling."
        - alert: KubeBrainObjectRequestMeteringDataIncomplete
          expr: (kubebrain_dbaas:object_request_data_complete or on() vector(0)) != 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain object request billing inputs are incomplete
            description: "The provider request exporter does not expose exactly one finalized hourly count for every write, list, read, and delete class, or the completeness recording series itself is absent. Request billing must fail closed."
        - alert: KubeBrainLogicalBackupMetricsMissing
          expr: count(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}) != 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: KubeBrain logical backup success metric is missing or non-unique
            description: "Exactly one logical backup success timestamp source is required. Configure one authoritative METRICS_OUTPUT textfile collector and remove stale or duplicate exporters before trusting backup RPO."
        - alert: KubeBrainLogicalBackupStale
          expr: (time() - max(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}) > 90000) or (max(kubebrain_logical_backup_last_success_timestamp_seconds{instance="kubebrain"}) > time() + 300)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain logical backup timestamp violates the production RPO clock envelope
            description: "The newest reported successful logical backup is more than 25 hours old or over 5 minutes in the future. A future timestamp must not suppress stale-backup detection; verify the authoritative exporter and node clock."
        - alert: KubeBrainResourceMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:compute_replicas:expected) == 1 or absent(kubebrain_dbaas:memory_working_set_sources:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:memory_working_set_sources:count != on() kubebrain_dbaas:compute_replicas:expected or (count(max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",container="kubebrain",resource="memory",unit="byte"})) + count(max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",resource="memory",unit="byte"}))) != on() kubebrain_dbaas:compute_replicas:expected
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane resource metrics are incomplete
            description: "Current KubeBrain/PD/TiKV cAdvisor memory usage or deduplicated kube-state-metrics memory-limit sources do not exactly match the current StatefulSet replica expectation, or an expectation/source recording series is absent."
        - alert: KubeBrainDataPlaneMemoryHigh
          expr: ((container_memory_working_set_bytes{namespace="kubebrain-system",container="kubebrain",image!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="kubebrain-system",container="kubebrain",resource="memory",unit="byte"}) > 0.9) or ((container_memory_working_set_bytes{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",resource="memory",unit="byte"}) > 0.9)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: KubeBrain data-plane container memory exceeds 90% of its limit
            description: "Container {{ $labels.container }} in {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."
        - alert: KubeBrainDataPlaneCPUThrottlingHigh
          expr: ((rate(container_cpu_cfs_throttled_periods_total{namespace="kubebrain-system",container="kubebrain",image!=""}[5m]) / rate(container_cpu_cfs_periods_total{namespace="kubebrain-system",container="kubebrain",image!=""}[5m])) > 0.25) or ((rate(container_cpu_cfs_throttled_periods_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[5m]) / rate(container_cpu_cfs_periods_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",container=~"pd|tikv",image!=""}[5m])) > 0.25)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane container CPU is heavily throttled
            description: "Container {{ $labels.container }} in {{ $labels.pod }} has {{ $value | humanizePercentage }} CPU periods throttled."
        - alert: KubeBrainNetworkMetricsMissing
          expr: absent(kubebrain_dbaas:replica_expectation_sources:count) == 1 or absent(kubebrain_dbaas:compute_replicas:expected) == 1 or absent(kubebrain_dbaas:network_receive_sources:count) == 1 or absent(kubebrain_dbaas:network_transmit_sources:count) == 1 or kubebrain_dbaas:replica_expectation_sources:count != 3 or kubebrain_dbaas:network_receive_sources:count != on() kubebrain_dbaas:compute_replicas:expected or kubebrain_dbaas:network_transmit_sources:count != on() kubebrain_dbaas:compute_replicas:expected
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network metrics are incomplete
            description: "Current KubeBrain/PD/TiKV cAdvisor RX or TX source counts do not exactly match the current StatefulSet replica expectation, or an expectation/source recording series is absent."
        - alert: KubeBrainNetworkErrors
          expr: (sum by (namespace, pod, interface) (increase(container_network_receive_errors_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[10m]) + increase(container_network_transmit_errors_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[10m])) > 0) or (sum by (namespace, pod, interface) (increase(container_network_receive_errors_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[10m]) + increase(container_network_transmit_errors_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[10m])) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network interface errors detected
            description: "Pod {{ $labels.pod }} reported {{ $value }} RX/TX errors on {{ $labels.interface }} in 10 minutes."
        - alert: KubeBrainNetworkPacketDrops
          expr: (sum by (namespace, pod, interface) (increase(container_network_receive_packets_dropped_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[10m]) + increase(container_network_transmit_packets_dropped_total{namespace="kubebrain-system",pod=~"kubebrain-[0-9]+",interface="eth0"}[10m])) > 0) or (sum by (namespace, pod, interface) (increase(container_network_receive_packets_dropped_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[10m]) + increase(container_network_transmit_packets_dropped_total{namespace="tidb-cluster",pod=~"kb-(pd|tikv)-[0-9]+",interface="eth0"}[10m])) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: KubeBrain data-plane network packets were dropped
            description: "Pod {{ $labels.pod }} dropped {{ $value }} RX/TX packets on {{ $labels.interface }} in 10 minutes."
