apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebrain-operation-audit
  labels:
    app.kubernetes.io/name: kubebrain-operation-audit
    app.kubernetes.io/part-of: kubebrain
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - dbaas.kubebrain.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - kubebrainoperations
        scope: Namespaced
  validations:
    - expression: 'request.operation != "CREATE" || (has(object.metadata.finalizers) && object.metadata.finalizers.exists(f, f == "dbaas.kubebrain.io/operation-audit"))'
      message: new operations require the audit archive finalizer
    - expression: 'request.operation != "CREATE" || !has(object.metadata.annotations) || (!("dbaas.kubebrain.io/approved-by" in object.metadata.annotations) && !("dbaas.kubebrain.io/approval-id" in object.metadata.annotations))'
      message: operations cannot be created pre-approved
    - expression: 'request.operation != "CREATE" || !has(object.metadata.annotations) || (!("dbaas.kubebrain.io/audit-receipt-sha256" in object.metadata.annotations) && !("dbaas.kubebrain.io/audit-artifact-sha256" in object.metadata.annotations) && !("dbaas.kubebrain.io/audit-version-id" in object.metadata.annotations))'
      message: operations cannot be created pre-archived
    - expression: |
        request.operation != "UPDATE" ||
        !has(object.metadata.annotations) ||
        ((!("dbaas.kubebrain.io/audit-receipt-sha256" in object.metadata.annotations) ||
            (has(oldObject.metadata.annotations) &&
              "dbaas.kubebrain.io/audit-receipt-sha256" in oldObject.metadata.annotations)) &&
          (!("dbaas.kubebrain.io/audit-artifact-sha256" in object.metadata.annotations) ||
            (has(oldObject.metadata.annotations) &&
              "dbaas.kubebrain.io/audit-artifact-sha256" in oldObject.metadata.annotations)) &&
          (!("dbaas.kubebrain.io/audit-version-id" in object.metadata.annotations) ||
            (has(oldObject.metadata.annotations) &&
              "dbaas.kubebrain.io/audit-version-id" in oldObject.metadata.annotations))) ||
        (request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-operation-archiver" &&
          has(oldObject.metadata.finalizers) &&
          oldObject.metadata.finalizers.exists(f, f == "dbaas.kubebrain.io/operation-audit") &&
          (!has(object.metadata.finalizers) ||
            !object.metadata.finalizers.exists(f, f == "dbaas.kubebrain.io/operation-audit")) &&
          object.status.phase in ["Succeeded", "Failed"] &&
          "dbaas.kubebrain.io/audit-receipt-sha256" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"].matches("^[a-f0-9]{64}$") &&
          "dbaas.kubebrain.io/audit-artifact-sha256" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"].matches("^[a-f0-9]{64}$") &&
          "dbaas.kubebrain.io/audit-version-id" in object.metadata.annotations &&
          size(object.metadata.annotations["dbaas.kubebrain.io/audit-version-id"]) > 0)
      message: operation audit archive evidence can only be introduced by archiver release
    - expression: |
        request.operation != "UPDATE" ||
        !has(object.metadata.annotations) ||
        (!("dbaas.kubebrain.io/approved-by" in object.metadata.annotations) &&
          !("dbaas.kubebrain.io/approval-id" in object.metadata.annotations)) ||
        (has(oldObject.metadata.annotations) &&
          "dbaas.kubebrain.io/approved-by" in oldObject.metadata.annotations &&
          "dbaas.kubebrain.io/approval-id" in oldObject.metadata.annotations &&
          "dbaas.kubebrain.io/approved-by" in object.metadata.annotations &&
          "dbaas.kubebrain.io/approval-id" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/approved-by"] == oldObject.metadata.annotations["dbaas.kubebrain.io/approved-by"] &&
          object.metadata.annotations["dbaas.kubebrain.io/approval-id"] == oldObject.metadata.annotations["dbaas.kubebrain.io/approval-id"]) ||
        ("dbaas.kubebrain.io/approved-by" in object.metadata.annotations &&
          "dbaas.kubebrain.io/approval-id" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/approved-by"] == request.userInfo.username &&
          object.metadata.annotations["dbaas.kubebrain.io/approval-id"].matches("^[a-z0-9]([-a-z0-9.]{0,126}[a-z0-9])?$") &&
          object.spec.type in ["BackupDeletion", "RestoreCutover", "CertificateRotation", "Destroy"] &&
          request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-operation-approver" &&
          (!has(object.status) || !has(object.status.phase) || object.status.phase == "Pending"))
      message: operation approval requires the dedicated approver identity, approval ID, and pending phase
    - expression: |
        request.operation != "UPDATE" ||
        !has(oldObject.metadata.annotations) ||
        (!("dbaas.kubebrain.io/approved-by" in oldObject.metadata.annotations) &&
          !("dbaas.kubebrain.io/approval-id" in oldObject.metadata.annotations)) ||
        (has(object.metadata.annotations) &&
          "dbaas.kubebrain.io/approved-by" in oldObject.metadata.annotations &&
          "dbaas.kubebrain.io/approval-id" in oldObject.metadata.annotations &&
          "dbaas.kubebrain.io/approved-by" in object.metadata.annotations &&
          "dbaas.kubebrain.io/approval-id" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/approved-by"] == oldObject.metadata.annotations["dbaas.kubebrain.io/approved-by"] &&
          object.metadata.annotations["dbaas.kubebrain.io/approval-id"] == oldObject.metadata.annotations["dbaas.kubebrain.io/approval-id"])
      message: operation approval evidence is immutable
    - expression: |
        request.operation != "UPDATE" ||
        !has(oldObject.metadata.annotations) ||
        (!("dbaas.kubebrain.io/audit-receipt-sha256" in oldObject.metadata.annotations) &&
          !("dbaas.kubebrain.io/audit-artifact-sha256" in oldObject.metadata.annotations) &&
          !("dbaas.kubebrain.io/audit-version-id" in oldObject.metadata.annotations)) ||
        (has(object.metadata.annotations) &&
          (!("dbaas.kubebrain.io/audit-receipt-sha256" in oldObject.metadata.annotations) ||
            ("dbaas.kubebrain.io/audit-receipt-sha256" in object.metadata.annotations &&
              object.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"])) &&
          (!("dbaas.kubebrain.io/audit-artifact-sha256" in oldObject.metadata.annotations) ||
            ("dbaas.kubebrain.io/audit-artifact-sha256" in object.metadata.annotations &&
              object.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"])) &&
          (!("dbaas.kubebrain.io/audit-version-id" in oldObject.metadata.annotations) ||
            ("dbaas.kubebrain.io/audit-version-id" in object.metadata.annotations &&
              object.metadata.annotations["dbaas.kubebrain.io/audit-version-id"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-version-id"])))
      message: operation audit archive evidence is immutable
    - expression: |
        request.operation != "UPDATE" ||
        !has(oldObject.metadata.finalizers) ||
        !oldObject.metadata.finalizers.exists(f, f == "dbaas.kubebrain.io/operation-audit") ||
        (has(object.metadata.finalizers) &&
          object.metadata.finalizers.exists(f, f == "dbaas.kubebrain.io/operation-audit")) ||
        (request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-operation-archiver" &&
          object.status.phase in ["Succeeded", "Failed"] &&
          has(object.metadata.annotations) &&
          "dbaas.kubebrain.io/audit-receipt-sha256" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"].matches("^[a-f0-9]{64}$") &&
          (!has(oldObject.metadata.annotations) ||
            !("dbaas.kubebrain.io/audit-receipt-sha256" in oldObject.metadata.annotations) ||
            object.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-receipt-sha256"]) &&
          "dbaas.kubebrain.io/audit-artifact-sha256" in object.metadata.annotations &&
          object.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"].matches("^[a-f0-9]{64}$") &&
          (!has(oldObject.metadata.annotations) ||
            !("dbaas.kubebrain.io/audit-artifact-sha256" in oldObject.metadata.annotations) ||
            object.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-artifact-sha256"]) &&
          "dbaas.kubebrain.io/audit-version-id" in object.metadata.annotations &&
          size(object.metadata.annotations["dbaas.kubebrain.io/audit-version-id"]) > 0 &&
          (!has(oldObject.metadata.annotations) ||
            !("dbaas.kubebrain.io/audit-version-id" in oldObject.metadata.annotations) ||
            object.metadata.annotations["dbaas.kubebrain.io/audit-version-id"] == oldObject.metadata.annotations["dbaas.kubebrain.io/audit-version-id"]))
      message: removing the audit finalizer requires terminal archive evidence
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebrain-operation-audit
  labels:
    app.kubernetes.io/name: kubebrain-operation-audit
    app.kubernetes.io/part-of: kubebrain
spec:
  policyName: kubebrain-operation-audit
  validationActions:
    - Deny
