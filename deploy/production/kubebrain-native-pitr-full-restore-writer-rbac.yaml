apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kubebrain-native-pitr-full-restore-writer-inspector, namespace: kubebrain-system}
rules:
  - {apiGroups: [apps], resources: [statefulsets], resourceNames: [kubebrain], verbs: [get]}
  - {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kubebrain-native-pitr-full-restore-writer-inspector, namespace: kubebrain-system}
subjects: [{kind: ServiceAccount, name: kubebrain-native-pitr-full-restore-executor, namespace: kubebrain-operations}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubebrain-native-pitr-full-restore-writer-inspector}
