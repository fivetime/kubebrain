apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-post-restore-audit-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints: {resourceRules: [{apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}]}
  matchConditions: [{name: post-restore-audit-scope, expression: '(object.spec.type == "PostRestoreAudit" && request.userInfo.username != "system:serviceaccount:kubebrain-operations:kubebrain-operation-api") || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-post-restore-audit-requester"'}]
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-post-restore-audit-requester"', message: post-restore audits require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^post-restore-audit-[a-f0-9]{20}$") && object.spec.operationID == object.metadata.name', message: post-restore audit identity must be deterministic}
    - {expression: 'object.spec.type == "PostRestoreAudit" && object.spec.requestedBy == "platform:post-restore-audit" && object.spec.instance.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && object.spec.maxAttempts == 5', message: post-restore audit shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$")', message: post-restore audit must bind its parameter Secret}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-post-restore-audit-request-operation}
spec: {policyName: kubebrain-post-restore-audit-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-post-restore-audit-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints: {resourceRules: [{apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}]}
  matchConditions: [{name: post-restore-audit-parameter-scope, expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^post-restore-audit-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-post-restore-audit-requester"'}]
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-post-restore-audit-requester"', message: post-restore audit parameters require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^post-restore-audit-[a-f0-9]{20}-parameters$") && object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: post-restore audit parameters must be one immutable opaque payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-post-restore-audit-request-parameters}
spec: {policyName: kubebrain-post-restore-audit-request-parameters, validationActions: [Deny]}
