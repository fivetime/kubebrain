apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-jwt-key-rotation-publish-secret}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}
  matchConditions:
    - name: jwt-publisher-secret-scope
      expression: 'object.metadata.name.matches("^jwt-key-rotate-[a-f0-9]{20}-keys$") || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-jwt-key-rotation-executor"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-jwt-key-rotation-executor"', message: JWT rotation key Secrets require the dedicated publisher identity}
    - {expression: 'namespaceObject != null && namespaceObject.metadata.labels["dbaas.kubebrain.io/dedicated"] == "true"', message: JWT rotation publishing is restricted to dedicated instance namespaces}
    - {expression: 'has(object.metadata.annotations) && "dbaas.kubebrain.io/jwt-key-rotation-operation" in object.metadata.annotations && object.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-operation"].matches("^jwt-key-rotate-[a-f0-9]{20}$") && object.metadata.name == object.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-operation"] + "-keys"', message: JWT rotation key Secret must bind its deterministic operation identity}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 2 && object.data.all(k, v, k.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && size(v) > 0)', message: JWT rotation key Secret must contain exactly two non-empty approved fields}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-jwt-key-rotation-publish-secret}
spec: {policyName: kubebrain-jwt-key-rotation-publish-secret, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-jwt-key-rotation-publish-statefulset}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], operations: [UPDATE], resources: [statefulsets], scope: Namespaced}
  matchConditions:
    - name: jwt-publisher-statefulset-scope
      expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-jwt-key-rotation-executor"'
  variables:
    - {name: newKubeBrain, expression: 'object.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0]'}
    - {name: oldKubeBrain, expression: 'oldObject.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0]'}
    - {name: newOperation, expression: 'object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-operation"]'}
    - {name: oldOperation, expression: 'oldObject.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-operation"]'}
    - {name: newChangedVolumes, expression: 'object.spec.template.spec.volumes.filter(v, !oldObject.spec.template.spec.volumes.exists(ov, ov.name == v.name && ov == v))'}
    - {name: oldChangedVolumes, expression: 'oldObject.spec.template.spec.volumes.filter(v, !object.spec.template.spec.volumes.exists(nv, nv.name == v.name && nv == v))'}
  validations:
    - {expression: 'namespaceObject != null && namespaceObject.metadata.labels["dbaas.kubebrain.io/dedicated"] == "true"', message: JWT rotation publishing is restricted to dedicated instance namespaces}
    - {expression: 'has(object.spec.template.metadata.annotations) && object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-operation"].matches("^jwt-key-rotate-[a-f0-9]{20}$") && object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-phase"] in ["phase-a", "phase-b", "phase-c"] && object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-secret-sha256"].matches("^[a-f0-9]{64}$") && object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-active-key-sha256"].matches("^[a-f0-9]{64}$")', message: JWT rotation StatefulSet update requires exact managed annotations}
    - {expression: 'has(object.spec.replicas) == has(oldObject.spec.replicas) && (!has(object.spec.replicas) || object.spec.replicas == oldObject.spec.replicas) && object.spec.selector == oldObject.spec.selector && object.spec.serviceName == oldObject.spec.serviceName && has(object.spec.podManagementPolicy) == has(oldObject.spec.podManagementPolicy) && (!has(object.spec.podManagementPolicy) || object.spec.podManagementPolicy == oldObject.spec.podManagementPolicy) && has(object.spec.updateStrategy) == has(oldObject.spec.updateStrategy) && (!has(object.spec.updateStrategy) || object.spec.updateStrategy == oldObject.spec.updateStrategy) && has(object.spec.volumeClaimTemplates) == has(oldObject.spec.volumeClaimTemplates) && (!has(object.spec.volumeClaimTemplates) || object.spec.volumeClaimTemplates == oldObject.spec.volumeClaimTemplates)', message: 'JWT publisher cannot change StatefulSet identity, scale, strategy, selector, or claims'}
    - {expression: 'object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels && object.spec.template.metadata.annotations.all(k, v, k in ["dbaas.kubebrain.io/jwt-key-rotation-operation", "dbaas.kubebrain.io/jwt-key-rotation-phase", "dbaas.kubebrain.io/jwt-key-secret-sha256", "dbaas.kubebrain.io/jwt-active-key-sha256"] || (has(oldObject.spec.template.metadata.annotations) && k in oldObject.spec.template.metadata.annotations && oldObject.spec.template.metadata.annotations[k] == v)) && (!has(oldObject.spec.template.metadata.annotations) || oldObject.spec.template.metadata.annotations.all(k, v, k in ["dbaas.kubebrain.io/jwt-key-rotation-operation", "dbaas.kubebrain.io/jwt-key-rotation-phase", "dbaas.kubebrain.io/jwt-key-secret-sha256", "dbaas.kubebrain.io/jwt-active-key-sha256"] || (k in object.spec.template.metadata.annotations && object.spec.template.metadata.annotations[k] == v)))', message: 'JWT publisher cannot change unmanaged Pod template metadata'}
    - expression: >-
        has(object.spec.template.spec.volumes) == has(oldObject.spec.template.spec.volumes) &&
        (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes == oldObject.spec.template.spec.volumes ||
          (object.spec.template.spec.volumes.size() == oldObject.spec.template.spec.volumes.size() &&
           object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-phase"] == "phase-a" &&
           oldObject.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-key-rotation-phase"] == "phase-c" &&
           variables.newOperation != variables.oldOperation &&
           object.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-active-key-sha256"] == oldObject.spec.template.metadata.annotations["dbaas.kubebrain.io/jwt-active-key-sha256"] &&
           variables.newChangedVolumes.size() == 1 && variables.oldChangedVolumes.size() == 1 &&
           variables.newChangedVolumes[0].name == variables.oldChangedVolumes[0].name &&
           has(variables.newChangedVolumes[0].secret) && has(variables.oldChangedVolumes[0].secret) &&
           variables.newChangedVolumes[0].secret.secretName == variables.newOperation + "-keys" &&
           variables.oldChangedVolumes[0].secret.secretName == variables.oldOperation + "-keys" &&
           has(variables.newChangedVolumes[0].secret.defaultMode) == has(variables.oldChangedVolumes[0].secret.defaultMode) &&
           (!has(variables.newChangedVolumes[0].secret.defaultMode) || variables.newChangedVolumes[0].secret.defaultMode == variables.oldChangedVolumes[0].secret.defaultMode) &&
           has(variables.newChangedVolumes[0].secret.items) == has(variables.oldChangedVolumes[0].secret.items) &&
           (!has(variables.newChangedVolumes[0].secret.items) || variables.newChangedVolumes[0].secret.items == variables.oldChangedVolumes[0].secret.items) &&
           has(variables.newChangedVolumes[0].secret.optional) == has(variables.oldChangedVolumes[0].secret.optional) &&
           (!has(variables.newChangedVolumes[0].secret.optional) || variables.newChangedVolumes[0].secret.optional == variables.oldChangedVolumes[0].secret.optional))) &&
        has(object.spec.template.spec.initContainers) == has(oldObject.spec.template.spec.initContainers) &&
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers == oldObject.spec.template.spec.initContainers) &&
        object.spec.template.spec.containers.size() == oldObject.spec.template.spec.containers.size() &&
        object.spec.template.spec.containers.filter(c, c.name != "kubebrain") == oldObject.spec.template.spec.containers.filter(c, c.name != "kubebrain")
      message: 'JWT publisher can change only one operation-bound Secret volume during a phase C to phase A transition'
    - {expression: 'has(object.spec.template.spec.serviceAccountName) == has(oldObject.spec.template.spec.serviceAccountName) && (!has(object.spec.template.spec.serviceAccountName) || object.spec.template.spec.serviceAccountName == oldObject.spec.template.spec.serviceAccountName) && has(object.spec.template.spec.securityContext) == has(oldObject.spec.template.spec.securityContext) && (!has(object.spec.template.spec.securityContext) || object.spec.template.spec.securityContext == oldObject.spec.template.spec.securityContext) && has(object.spec.template.spec.nodeSelector) == has(oldObject.spec.template.spec.nodeSelector) && (!has(object.spec.template.spec.nodeSelector) || object.spec.template.spec.nodeSelector == oldObject.spec.template.spec.nodeSelector) && has(object.spec.template.spec.affinity) == has(oldObject.spec.template.spec.affinity) && (!has(object.spec.template.spec.affinity) || object.spec.template.spec.affinity == oldObject.spec.template.spec.affinity) && has(object.spec.template.spec.tolerations) == has(oldObject.spec.template.spec.tolerations) && (!has(object.spec.template.spec.tolerations) || object.spec.template.spec.tolerations == oldObject.spec.template.spec.tolerations) && has(object.spec.template.spec.imagePullSecrets) == has(oldObject.spec.template.spec.imagePullSecrets) && (!has(object.spec.template.spec.imagePullSecrets) || object.spec.template.spec.imagePullSecrets == oldObject.spec.template.spec.imagePullSecrets) && has(object.spec.template.spec.hostNetwork) == has(oldObject.spec.template.spec.hostNetwork) && (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == oldObject.spec.template.spec.hostNetwork) && has(object.spec.template.spec.dnsPolicy) == has(oldObject.spec.template.spec.dnsPolicy) && (!has(object.spec.template.spec.dnsPolicy) || object.spec.template.spec.dnsPolicy == oldObject.spec.template.spec.dnsPolicy) && has(object.spec.template.spec.schedulerName) == has(oldObject.spec.template.spec.schedulerName) && (!has(object.spec.template.spec.schedulerName) || object.spec.template.spec.schedulerName == oldObject.spec.template.spec.schedulerName) && has(object.spec.template.spec.topologySpreadConstraints) == has(oldObject.spec.template.spec.topologySpreadConstraints) && (!has(object.spec.template.spec.topologySpreadConstraints) || object.spec.template.spec.topologySpreadConstraints == oldObject.spec.template.spec.topologySpreadConstraints)', message: 'JWT publisher cannot change Pod identity, placement, networking, or security policy'}
    - {expression: 'object.spec.template.spec.containers.filter(c, c.name == "kubebrain").size() == 1 && oldObject.spec.template.spec.containers.filter(c, c.name == "kubebrain").size() == 1 && variables.newKubeBrain.image == variables.oldKubeBrain.image && has(variables.newKubeBrain.imagePullPolicy) == has(variables.oldKubeBrain.imagePullPolicy) && (!has(variables.newKubeBrain.imagePullPolicy) || variables.newKubeBrain.imagePullPolicy == variables.oldKubeBrain.imagePullPolicy) && has(variables.newKubeBrain.command) == has(variables.oldKubeBrain.command) && (!has(variables.newKubeBrain.command) || variables.newKubeBrain.command == variables.oldKubeBrain.command) && has(variables.newKubeBrain.ports) == has(variables.oldKubeBrain.ports) && (!has(variables.newKubeBrain.ports) || variables.newKubeBrain.ports == variables.oldKubeBrain.ports) && has(variables.newKubeBrain.env) == has(variables.oldKubeBrain.env) && (!has(variables.newKubeBrain.env) || variables.newKubeBrain.env == variables.oldKubeBrain.env) && has(variables.newKubeBrain.envFrom) == has(variables.oldKubeBrain.envFrom) && (!has(variables.newKubeBrain.envFrom) || variables.newKubeBrain.envFrom == variables.oldKubeBrain.envFrom) && has(variables.newKubeBrain.volumeMounts) == has(variables.oldKubeBrain.volumeMounts) && (!has(variables.newKubeBrain.volumeMounts) || variables.newKubeBrain.volumeMounts == variables.oldKubeBrain.volumeMounts) && has(variables.newKubeBrain.resources) == has(variables.oldKubeBrain.resources) && (!has(variables.newKubeBrain.resources) || variables.newKubeBrain.resources == variables.oldKubeBrain.resources) && has(variables.newKubeBrain.securityContext) == has(variables.oldKubeBrain.securityContext) && (!has(variables.newKubeBrain.securityContext) || variables.newKubeBrain.securityContext == variables.oldKubeBrain.securityContext) && has(variables.newKubeBrain.livenessProbe) == has(variables.oldKubeBrain.livenessProbe) && (!has(variables.newKubeBrain.livenessProbe) || variables.newKubeBrain.livenessProbe == variables.oldKubeBrain.livenessProbe) && has(variables.newKubeBrain.readinessProbe) == has(variables.oldKubeBrain.readinessProbe) && (!has(variables.newKubeBrain.readinessProbe) || variables.newKubeBrain.readinessProbe == variables.oldKubeBrain.readinessProbe) && has(variables.newKubeBrain.startupProbe) == has(variables.oldKubeBrain.startupProbe) && (!has(variables.newKubeBrain.startupProbe) || variables.newKubeBrain.startupProbe == variables.oldKubeBrain.startupProbe) && has(variables.newKubeBrain.lifecycle) == has(variables.oldKubeBrain.lifecycle) && (!has(variables.newKubeBrain.lifecycle) || variables.newKubeBrain.lifecycle == variables.oldKubeBrain.lifecycle) && has(variables.newKubeBrain.workingDir) == has(variables.oldKubeBrain.workingDir) && (!has(variables.newKubeBrain.workingDir) || variables.newKubeBrain.workingDir == variables.oldKubeBrain.workingDir)', message: JWT publisher cannot change KubeBrain runtime fields other than auth-token args}
    - {expression: 'object.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0].args.filter(a, !a.startsWith("--auth-token=")) == oldObject.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0].args.filter(a, !a.startsWith("--auth-token=")) && object.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0].args.filter(a, a.startsWith("--auth-token=")).size() == 1 && oldObject.spec.template.spec.containers.filter(c, c.name == "kubebrain")[0].args.filter(a, a.startsWith("--auth-token=")).size() == 1', message: JWT publisher may replace only the unique auth-token argument}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-jwt-key-rotation-publish-statefulset}
spec: {policyName: kubebrain-jwt-key-rotation-publish-statefulset, validationActions: [Deny]}
