apiVersion: v1
kind: Namespace
metadata:
  name: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/component: client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/component: peer
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubebrain
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
spec:
  serviceName: kubebrain-peer
  replicas: 3
  revisionHistoryLimit: 5
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain
    spec:
      serviceAccountName: kubebrain
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kubebrain
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kubebrain
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          args:
            - --port=3379
            - --peer-port=3380
            - --info-port=8080
            - --advertise-host=$(POD_NAME).kubebrain-peer.kubebrain-system.svc
            - --initial-cluster=kubebrain-0=https://kubebrain-0.kubebrain-peer.kubebrain-system.svc:3380,kubebrain-1=https://kubebrain-1.kubebrain-peer.kubebrain-system.svc:3380,kubebrain-2=https://kubebrain-2.kubebrain-peer.kubebrain-system.svc:3380
            - --pd-addrs=kb-pd.tidb-cluster.svc:2379
            - --compatible-with-etcd=true
            - --max-txn-ops=128
            - --max-request-bytes=1572864
            - --max-concurrent-streams=4294967295
            - --max-requests-inflight=1024
            - --max-request-rate=2000
            - --request-rate-burst=4000
            - --max-delete-range-keys=1024
            - --max-watches=10000
            - --grpc-keepalive-min-time=5s
            - --grpc-keepalive-interval=2h
            - --grpc-keepalive-timeout=20s
            - --auth-token=simple
            - --bcrypt-cost=10
            - --auth-token-ttl=300
            - --grpc-max-connection-age=1h
            - --grpc-max-connection-age-grace=5m
            - --tls-min-version=TLS1.2
            - --cert-file=/etc/kubebrain/client-tls/tls.crt
            - --key-file=/etc/kubebrain/client-tls/tls.key
            - --trusted-ca-file=/etc/kubebrain/client-tls/ca.crt
            - --tls-server-name=kubebrain-client.kubebrain-system.svc
            - --client-cert-auth=true
            - --peer-cert-file=/etc/kubebrain/peer-tls/tls.crt
            - --peer-key-file=/etc/kubebrain/peer-tls/tls.key
            - --peer-trusted-ca-file=/etc/kubebrain/peer-tls/ca.crt
            - --peer-tls-server-name=kubebrain-peer.kubebrain-system.svc
            - --peer-client-cert-auth=true
            - --v=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 3379
            - name: peer
              containerPort: 3380
            - name: info
              containerPort: 8080
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /ready
              port: info
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /health
              port: info
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              scheme: HTTP
              path: /health
              port: info
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          volumeMounts:
            - name: client-tls
              mountPath: /etc/kubebrain/client-tls
              readOnly: true
            - name: peer-tls
              mountPath: /etc/kubebrain/peer-tls
              readOnly: true
      volumes:
        - name: client-tls
          secret:
            secretName: kubebrain-client-tls
        - name: peer-tls
          secret:
            secretName: kubebrain-peer-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-client
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebrain
  ports:
    - name: client
      port: 3379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-peer
  namespace: kubebrain-system
  labels:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/component: peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebrain
  ports:
    - name: peer
      port: 3380
      targetPort: peer
    - name: info
      port: 8080
      targetPort: info
