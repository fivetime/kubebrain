apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-info-certificate-rotation-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules: [{apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}]
  matchConditions:
    - {name: info-certificate-rotation-scope, expression: 'object.spec.type == "InfoCertificateRotation" || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-info-certificate-rotation-requester"'}
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-info-certificate-rotation-requester"', message: info certificate rotation operations require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations"', message: info certificate rotation requester is restricted to the production operation queue}
    - {expression: 'object.metadata.name.matches("^info-cert-rotate-[a-f0-9]{20}$") && object.spec.operationID == object.metadata.name', message: info certificate rotation operation identity must be deterministic}
    - {expression: 'object.spec.type == "InfoCertificateRotation" && object.spec.requestedBy == "platform:info-certificate-rotation" && object.spec.instance.matches("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$") && object.spec.maxAttempts == 5', message: info certificate rotation operation shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$")', message: info certificate rotation operation must bind its immutable parameter Secret}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-info-certificate-rotation-request-operation}
spec: {policyName: kubebrain-info-certificate-rotation-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-info-certificate-rotation-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules: [{apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}]
  matchConditions:
    - {name: info-certificate-rotation-parameter-scope, expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^info-cert-rotate-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-info-certificate-rotation-requester"'}
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-info-certificate-rotation-requester"', message: info certificate rotation parameter Secrets require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^info-cert-rotate-[a-f0-9]{20}-parameters$")', message: info certificate rotation parameter Secret identity is fixed}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: info certificate rotation parameters must be one immutable opaque payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-info-certificate-rotation-request-parameters}
spec: {policyName: kubebrain-info-certificate-rotation-request-parameters, validationActions: [Deny]}
