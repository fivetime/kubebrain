apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-cold-snapshot-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}
  matchConditions:
    - name: cold-snapshot-scope
      expression: 'object.spec.type == "ColdPhysicalSnapshot" || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-cold-physical-snapshot-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-cold-physical-snapshot-requester"', message: cold snapshot operations require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations"', message: cold snapshot requester is restricted to the production operation queue}
    - {expression: 'object.metadata.name.matches("^cold-snapshot-[a-f0-9]{20}$") && object.spec.operationID == object.metadata.name', message: cold snapshot operation identity must be deterministic}
    - {expression: 'object.spec.type == "ColdPhysicalSnapshot" && object.spec.requestedBy == "platform:cold-physical-snapshot" && object.spec.instance == "kubebrain" && object.spec.maxAttempts == 1', message: cold snapshot operation shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$")', message: cold snapshot operation must bind its immutable parameter Secret}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-cold-snapshot-request-operation}
spec: {policyName: kubebrain-cold-snapshot-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-cold-snapshot-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}
  matchConditions:
    - name: cold-snapshot-parameter-scope
      expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^cold-snapshot-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-cold-physical-snapshot-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-cold-physical-snapshot-requester"', message: cold snapshot parameter Secrets require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^cold-snapshot-[a-f0-9]{20}-parameters$")', message: cold snapshot parameter Secret identity is fixed}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: cold snapshot parameters must be one immutable opaque payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-cold-snapshot-request-parameters}
spec: {policyName: kubebrain-cold-snapshot-request-parameters, validationActions: [Deny]}
