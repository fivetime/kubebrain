apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubebrain-operation-parameter-broker-token-review
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubebrain-operation-parameter-broker-token-review
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
subjects:
  - kind: ServiceAccount
    name: kubebrain-operation-parameter-broker
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubebrain-operation-parameter-broker-token-review
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
rules:
  - apiGroups: [dbaas.kubebrain.io]
    resources: [kubebrainoperations]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
subjects:
  - kind: ServiceAccount
    name: kubebrain-operation-parameter-broker
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-operation-parameter-broker
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
spec:
  selector:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-operation-parameter-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain-operation-parameter-broker
        app.kubernetes.io/part-of: kubebrain
    spec:
      serviceAccountName: kubebrain-operation-parameter-broker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain-operation-parameter-broker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain-operation-parameter-broker
      containers:
        - name: broker
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/kubebrain-operation-parameter-broker]
          args:
            - --listen-address=:8443
            - --namespace=kubebrain-operations
            - --token-audience=kubebrain-operation-parameters
            - --tls-cert-file=/var/run/kubebrain-parameter-tls/tls.crt
            - --tls-key-file=/var/run/kubebrain-parameter-tls/tls.key
            - --tls-reload-interval=30s
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /readyz, port: https}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /healthz, port: https}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /var/run/kubebrain-parameter-tls, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: kubebrain-operation-parameter-broker-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-operation-parameter-broker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubebrain-operation-parameter-broker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-parameter-broker
    app.kubernetes.io/part-of: kubebrain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-operation-parameter-broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kubebrain-backup-executor
                  - kubebrain-backup-deletion-executor
                  - kubebrain-restore-cutover-executor
                  - kubebrain-post-restore-audit-executor
                  - kubebrain-certificate-rotation-executor
                  - kubebrain-destroy-executor
      ports:
        - {protocol: TCP, port: 8443}
