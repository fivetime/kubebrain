apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubebrainbackuppolicies.dbaas.kubebrain.io
spec:
  group: dbaas.kubebrain.io
  scope: Namespaced
  names:
    plural: kubebrainbackuppolicies
    singular: kubebrainbackuppolicy
    kind: KubeBrainBackupPolicy
    shortNames:
      - kbbp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Instance
          type: string
          jsonPath: .spec.instance
        - name: Interval
          type: integer
          jsonPath: .spec.intervalSeconds
        - name: Suspended
          type: boolean
          jsonPath: .spec.suspend
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenant
                - instance
                - intervalSeconds
                - retentionSeconds
                - maxAttempts
                - parametersTemplateSecretRef
              properties:
                tenant:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                instance:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                intervalSeconds:
                  type: integer
                  format: int64
                  minimum: 300
                  maximum: 2592000
                retentionSeconds:
                  type: integer
                  format: int64
                  minimum: 3600
                  maximum: 315360000
                maxAttempts:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 100
                  default: 3
                suspend:
                  type: boolean
                  default: false
                parametersTemplateSecretRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                    key:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[-._a-zA-Z0-9]+$'
