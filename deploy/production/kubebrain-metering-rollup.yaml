apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebrain-metering-rollup
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-metering-rollup
    app.kubernetes.io/part-of: kubebrain
spec:
  schedule: "47 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubebrain-metering-rollup
            app.kubernetes.io/part-of: kubebrain
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: roller
              image: kubebrain:dev
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/kubebrain-metering-rollup
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: endpoint
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: region
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: secret-access-key
                - name: S3_FORCE_PATH_STYLE
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: force-path-style
                - name: OBJECT_STORE_ID
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: object-store-id
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: kubebrain-metering-rollup-object-store
                      key: bucket
              args:
                - --instance=kubebrain
                - --object-store-id=$(OBJECT_STORE_ID)
                - --bucket=$(S3_BUCKET)
                - --sample-prefix=metering-samples
                - --rollup-prefix=metering-rollups
                - --retention-mode=COMPLIANCE
                - --retention-duration=61320h
                - --period-duration=24h
                - --finalization-delay=30m
                - --slot-duration=1h
                - --max-staleness=5m
                - --timeout=20m
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
