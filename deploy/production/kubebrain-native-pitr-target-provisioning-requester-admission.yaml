apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-native-pitr-target-provisioning-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints: {resourceRules: [{apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}]}
  matchConditions: [{name: provisioning-scope, expression: '(object.spec.type == "NativePITRTargetProvisioning" && request.userInfo.username != "system:serviceaccount:kubebrain-operations:kubebrain-operation-api") || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-target-provisioning-requester"'}]
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-target-provisioning-requester"', message: target provisioning requires its dedicated requester}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^native-pitr-provision-[a-f0-9]{20}$") && object.spec.operationID == object.metadata.name', message: target provisioning identity is digest-bound}
    - {expression: 'object.spec.type == "NativePITRTargetProvisioning" && object.spec.requestedBy == "platform:native-pitr-target-provisioning" && object.spec.instance == "kubebrain" && object.spec.maxAttempts == 2', message: target provisioning operation shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$") && object.metadata.name.endsWith(object.spec.parametersSHA256.substring(0,20))', message: target provisioning parameters are digest-bound}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-native-pitr-target-provisioning-request-operation}
spec: {policyName: kubebrain-native-pitr-target-provisioning-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-native-pitr-target-provisioning-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints: {resourceRules: [{apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}]}
  matchConditions: [{name: provisioning-parameter-scope, expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^native-pitr-provision-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-target-provisioning-requester"'}]
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-target-provisioning-requester"', message: target provisioning parameter Secrets require the dedicated requester}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^native-pitr-provision-[a-f0-9]{20}-parameters$")', message: target provisioning parameter Secret identity is fixed}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: target provisioning parameters must be one immutable payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-native-pitr-target-provisioning-request-parameters}
spec: {policyName: kubebrain-native-pitr-target-provisioning-request-parameters, validationActions: [Deny]}
