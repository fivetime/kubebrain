apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-operation-archive-verifier
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-archive-verifier
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-operation-archive-verifier
  namespace: kubebrain-operations
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kubebrain-backup-scheduler-inventory"]
    verbs: ["get"]
  - apiGroups: ["dbaas.kubebrain.io"]
    resources: ["kubebrainoperations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-operation-archive-verifier
  namespace: kubebrain-operations
subjects:
  - kind: ServiceAccount
    name: kubebrain-operation-archive-verifier
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-operation-archive-verifier
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebrain-operation-archive-verifier
  namespace: kubebrain-operations
  annotations:
    dbaas.kubebrain.io/iam-simulation-sha256: pending
    dbaas.kubebrain.io/iam-simulation-signature-sha256: pending
    dbaas.kubebrain.io/iam-simulation-trust-public-key-sha256: pending
    dbaas.kubebrain.io/iam-simulation-valid-until-unix: pending
    dbaas.kubebrain.io/credential-secret-uid: pending
    dbaas.kubebrain.io/credential-secret-resource-version: pending
    dbaas.kubebrain.io/credential-secret-data-sha256: pending
  labels:
    app.kubernetes.io/name: kubebrain-operation-archive-verifier
    app.kubernetes.io/part-of: kubebrain
spec:
  schedule: "17 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 900
  jobTemplate:
    metadata:
      annotations:
        dbaas.kubebrain.io/iam-simulation-sha256: pending
        dbaas.kubebrain.io/iam-simulation-signature-sha256: pending
        dbaas.kubebrain.io/iam-simulation-trust-public-key-sha256: pending
        dbaas.kubebrain.io/iam-simulation-valid-until-unix: pending
        dbaas.kubebrain.io/credential-secret-uid: pending
        dbaas.kubebrain.io/credential-secret-resource-version: pending
        dbaas.kubebrain.io/credential-secret-data-sha256: pending
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          annotations:
            dbaas.kubebrain.io/iam-simulation-sha256: pending
            dbaas.kubebrain.io/iam-simulation-signature-sha256: pending
            dbaas.kubebrain.io/iam-simulation-trust-public-key-sha256: pending
            dbaas.kubebrain.io/iam-simulation-valid-until-unix: pending
            dbaas.kubebrain.io/credential-secret-uid: pending
            dbaas.kubebrain.io/credential-secret-resource-version: pending
            dbaas.kubebrain.io/credential-secret-data-sha256: pending
          labels:
            app.kubernetes.io/name: kubebrain-operation-archive-verifier
            app.kubernetes.io/part-of: kubebrain
        spec:
          serviceAccountName: kubebrain-operation-archive-verifier
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verifier
              image: kubebrain:dev
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/kubebrain-operation-archive-verifier"]
              args:
                - --namespace-inventory-configmap=kubebrain-backup-scheduler-inventory
                - --namespace-inventory-namespace=kubebrain-operations
                - --namespace-inventory-key=namespaces.json
                - --object-store-id=$(OBJECT_STORE_ID)
                - --bucket=$(S3_BUCKET)
                - --object-prefix=operation-audit
                - --retention-mode=COMPLIANCE
                - --retention-duration=8760h
                - --reconcile-timeout=15m
                - --verify-timeout=2m
                - --max-batch=256
                - --max-scan-items=10000
                - --max-scan-bytes=67108864
              env:
                - {name: S3_ENDPOINT, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: endpoint}}}
                - {name: AWS_REGION, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: region}}}
                - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: access-key-id}}}
                - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: secret-access-key}}}
                - {name: S3_FORCE_PATH_STYLE, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: force-path-style}}}
                - {name: OBJECT_STORE_ID, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: object-store-id}}}
                - {name: S3_BUCKET, valueFrom: {secretKeyRef: {name: kubebrain-operation-archive-verifier-object-store, key: bucket}}}
                - {name: IAM_SIMULATION_VALID_UNTIL_UNIX, value: "1"}
                - {name: CREDENTIAL_SECRET_DATA_SHA256, value: pending}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 128Mi}
