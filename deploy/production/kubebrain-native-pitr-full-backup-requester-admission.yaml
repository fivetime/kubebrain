apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-native-pitr-full-backup-request-operation}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [dbaas.kubebrain.io], apiVersions: [v1alpha1], operations: [CREATE], resources: [kubebrainoperations], scope: Namespaced}
  matchConditions:
    - name: native-pitr-full-backup-scope
      expression: 'object.spec.type == "NativePITRFullBackup" || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-full-backup-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-full-backup-requester"', message: native PITR full backup operations require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations"', message: native PITR full backup requester is restricted to the production operation queue}
    - {expression: 'object.metadata.name == "native-pitr-full-" + object.spec.parametersSHA256.substring(0, 20) && object.spec.operationID == object.metadata.name', message: native PITR full backup operation identity must derive from the parameter digest}
    - {expression: 'object.spec.type == "NativePITRFullBackup" && object.spec.requestedBy == "platform:native-pitr-full-backup" && object.spec.instance == "kubebrain" && object.spec.maxAttempts == 1', message: native PITR full backup operation shape is fixed}
    - {expression: 'object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json" && object.spec.parametersSHA256.matches("^[a-f0-9]{64}$")', message: native PITR full backup operation must bind its immutable parameter Secret}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-native-pitr-full-backup-request-operation}
spec: {policyName: kubebrain-native-pitr-full-backup-request-operation, validationActions: [Deny]}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: kubebrain-native-pitr-full-backup-request-parameters}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [secrets], scope: Namespaced}
  matchConditions:
    - name: native-pitr-full-backup-parameter-scope
      expression: '(object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^native-pitr-full-[a-f0-9]{20}-parameters$")) || request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-full-backup-requester"'
  validations:
    - {expression: 'request.userInfo.username == "system:serviceaccount:kubebrain-operations:kubebrain-native-pitr-full-backup-requester"', message: native PITR full backup parameter Secrets require the dedicated requester identity}
    - {expression: 'object.metadata.namespace == "kubebrain-operations" && object.metadata.name.matches("^native-pitr-full-[a-f0-9]{20}-parameters$")', message: native PITR full backup parameter Secret identity is fixed}
    - {expression: 'object.immutable == true && object.type == "Opaque" && size(object.data) == 1 && "parameters.json" in object.data', message: native PITR full backup parameters must be one immutable opaque payload}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: kubebrain-native-pitr-full-backup-request-parameters}
spec: {policyName: kubebrain-native-pitr-full-backup-request-parameters, validationActions: [Deny]}
