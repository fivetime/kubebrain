apiVersion: v1
kind: Namespace
metadata:
  name: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-worker
    app.kubernetes.io/part-of: kubebrain
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-operation-worker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-worker
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-operation-worker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-worker
    app.kubernetes.io/part-of: kubebrain
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kubebrain-backup-scheduler-inventory
    verbs:
      - get
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainoperations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dbaas.kubebrain.io
    resources:
      - kubebrainoperations/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-operation-worker
  namespace: kubebrain-operations
  labels:
    app.kubernetes.io/name: kubebrain-operation-worker
    app.kubernetes.io/part-of: kubebrain
subjects:
  - kind: ServiceAccount
    name: kubebrain-backup-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-backup-deletion-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-restore-cutover-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-post-restore-audit-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-certificate-rotation-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-tikv-transaction-repair-executor
    namespace: kubebrain-operations
  - kind: ServiceAccount
    name: kubebrain-destroy-executor
    namespace: kubebrain-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-operation-worker
