apiVersion: v1
kind: Namespace
metadata:
  name: kubebrain-kms-lifecycle
  labels:
    app.kubernetes.io/part-of: kubebrain
    dbaas.kubebrain.io/kms-lifecycle-boundary: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-jwt-kms-lifecycle
  namespace: kubebrain-kms-lifecycle
  labels:
    app.kubernetes.io/name: kubebrain-jwt-kms-lifecycle
    app.kubernetes.io/part-of: kubebrain
automountServiceAccountToken: false
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebrain-jwt-kms-lifecycle-credential
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: lifecycle-credential
      expression: 'object.metadata.namespace == "kubebrain-kms-lifecycle" && ((has(object.metadata.labels) && "dbaas.kubebrain.io/credential-kind" in object.metadata.labels && object.metadata.labels["dbaas.kubebrain.io/credential-kind"] == "jwt-kms-lifecycle") || (request.operation == "UPDATE" && has(oldObject.metadata.labels) && "dbaas.kubebrain.io/credential-kind" in oldObject.metadata.labels && oldObject.metadata.labels["dbaas.kubebrain.io/credential-kind"] == "jwt-kms-lifecycle"))'
  validations:
    - expression: 'has(object.metadata.labels) && "dbaas.kubebrain.io/credential-kind" in object.metadata.labels && object.metadata.labels["dbaas.kubebrain.io/credential-kind"] == "jwt-kms-lifecycle"'
      message: lifecycle credential label cannot be removed or changed
    - expression: 'object.metadata.name.matches("^kubebrain-jwt-kms-lifecycle-[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$")'
      message: lifecycle credential Secret name must contain a versioned credential identifier
    - expression: 'object.type == "Opaque" && object.immutable == true'
      message: lifecycle credential Secret must be immutable Opaque
    - expression: 'size(object.data) == 4 && object.data.all(k, v, k in ["endpoint","lifecycle-token","ca.crt","receipt-public-key.pem"] && size(v) > 0)'
      message: lifecycle credential Secret must contain exactly four non-empty approved fields
    - expression: 'request.operation != "UPDATE" || object.data == oldObject.data'
      message: lifecycle credential data cannot change in place
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebrain-jwt-kms-lifecycle-credential
spec:
  policyName: kubebrain-jwt-kms-lifecycle-credential
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebrain-jwt-kms-lifecycle-active
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: active-credential
      expression: 'object.metadata.namespace == "kubebrain-kms-lifecycle" && object.metadata.name == "kubebrain-jwt-kms-lifecycle-active"'
  validations:
    - expression: 'size(object.data) == 9 && object.data.all(k, v, k in ["format","credential-id","secret-name","secret-uid","secret-resource-version","secret-data-sha256","readiness-receipt-sha256","readiness-expires-at-unix","activated-at-unix"] && size(v) > 0)'
      message: active lifecycle credential pointer must contain exactly nine fields
    - expression: 'object.data["format"] == "kubebrain.jwt-kms-lifecycle-active.v1" && object.data["credential-id"].matches("^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$") && object.data["secret-name"] == "kubebrain-jwt-kms-lifecycle-" + object.data["credential-id"]'
      message: active lifecycle credential identity is invalid
    - expression: 'object.data["secret-data-sha256"].matches("^[a-f0-9]{64}$") && object.data["readiness-receipt-sha256"].matches("^[a-f0-9]{64}$") && object.data["readiness-expires-at-unix"].matches("^[1-9][0-9]*$") && object.data["activated-at-unix"].matches("^[1-9][0-9]*$")'
      message: active lifecycle credential evidence binding is invalid
    - expression: 'object.data["secret-uid"].matches("^[^[:space:][:cntrl:]]{1,128}$") && object.data["secret-resource-version"].matches("^[^[:space:][:cntrl:]]{1,128}$") && int(object.data["readiness-expires-at-unix"]) > int(object.data["activated-at-unix"])'
      message: active lifecycle credential Secret identity or readiness time is invalid
    - expression: '!has(object.metadata.annotations) || !("dbaas.kubebrain.io/retirement-in-progress" in object.metadata.annotations) || (object.metadata.annotations["dbaas.kubebrain.io/retirement-in-progress"].matches("^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$") && object.metadata.annotations["dbaas.kubebrain.io/retirement-in-progress"] != object.data["credential-id"])'
      message: retirement-in-progress must identify a non-active versioned credential
    - expression: '!has(object.metadata.annotations) || !("dbaas.kubebrain.io/last-retired-credential" in object.metadata.annotations) || (object.metadata.annotations["dbaas.kubebrain.io/last-retired-credential"].matches("^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$") && object.metadata.annotations["dbaas.kubebrain.io/last-retired-credential"] != object.data["credential-id"])'
      message: an externally revoked credential cannot be active
    - expression: 'request.operation != "UPDATE" || !has(oldObject.metadata.annotations) || !("dbaas.kubebrain.io/retirement-in-progress" in oldObject.metadata.annotations) || (has(object.metadata.annotations) && (("dbaas.kubebrain.io/retirement-in-progress" in object.metadata.annotations && object.metadata.annotations["dbaas.kubebrain.io/retirement-in-progress"] == oldObject.metadata.annotations["dbaas.kubebrain.io/retirement-in-progress"]) || ("dbaas.kubebrain.io/last-retired-credential" in object.metadata.annotations && object.metadata.annotations["dbaas.kubebrain.io/last-retired-credential"] == oldObject.metadata.annotations["dbaas.kubebrain.io/retirement-in-progress"])))'
      message: retirement-in-progress can only be preserved or completed for the same credential
    - expression: 'request.operation != "UPDATE" || !has(oldObject.metadata.annotations) || !("dbaas.kubebrain.io/last-retired-credential" in oldObject.metadata.annotations) || (has(object.metadata.annotations) && "dbaas.kubebrain.io/last-retired-credential" in object.metadata.annotations)'
      message: last-retired-credential cannot be removed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebrain-jwt-kms-lifecycle-active
spec:
  policyName: kubebrain-jwt-kms-lifecycle-active
  validationActions: [Deny]
