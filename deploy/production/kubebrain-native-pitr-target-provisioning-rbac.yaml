apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kubebrain-native-pitr-target-provisioning-executor, namespace: tidb-cluster}
rules:
  - {apiGroups: [pingcap.com], resources: [tidbclusters], verbs: [get, create, watch]}
  - {apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kubebrain-native-pitr-target-provisioning-executor, namespace: tidb-cluster}
subjects: [{kind: ServiceAccount, name: kubebrain-native-pitr-target-provisioning-executor, namespace: kubebrain-operations}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubebrain-native-pitr-target-provisioning-executor}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kubebrain-native-pitr-target-provisioning-inspector}
rules:
  - {apiGroups: [""], resources: [persistentvolumes], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: kubebrain-native-pitr-target-provisioning-inspector}
subjects: [{kind: ServiceAccount, name: kubebrain-native-pitr-target-provisioning-executor, namespace: kubebrain-operations}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubebrain-native-pitr-target-provisioning-inspector}
