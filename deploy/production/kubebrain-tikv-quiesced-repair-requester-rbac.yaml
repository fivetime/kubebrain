apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: kubebrain-repair-operations
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: kubebrain-repair-operations
rules:
  - apiGroups: [dbaas.kubebrain.io]
    resources: [kubebrainoperations]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: kubebrain-repair-operations
subjects:
  - kind: ServiceAccount
    name: kubebrain-tikv-quiesced-repair-requester
    namespace: kubebrain-repair-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-tikv-quiesced-repair-requester
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: kubebrain-system
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [kubebrain]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: kubebrain-system
subjects:
  - kind: ServiceAccount
    name: kubebrain-tikv-quiesced-repair-requester
    namespace: kubebrain-repair-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-tikv-quiesced-repair-requester
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: tidb-cluster
rules:
  - apiGroups: [pingcap.com]
    resources: [tidbclusters]
    resourceNames: [kb]
    verbs: [get]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["http:kb-pd:2379"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubebrain-tikv-quiesced-repair-requester
  namespace: tidb-cluster
subjects:
  - kind: ServiceAccount
    name: kubebrain-tikv-quiesced-repair-requester
    namespace: kubebrain-repair-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubebrain-tikv-quiesced-repair-requester
