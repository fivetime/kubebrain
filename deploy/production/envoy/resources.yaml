apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebrain-envoy
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain-envoy
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-envoy
      app.kubernetes.io/instance: kubebrain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebrain-envoy
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
spec:
  replicas: 3
  minReadySeconds: 20
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-envoy
      app.kubernetes.io/instance: kubebrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebrain-envoy
        app.kubernetes.io/instance: kubebrain
        app.kubernetes.io/component: client-proxy
    spec:
      serviceAccountName: kubebrain-envoy
      automountServiceAccountToken: false
      priorityClassName: kubebrain-dbaas-critical
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain-envoy
              app.kubernetes.io/instance: kubebrain
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubebrain-envoy
                    app.kubernetes.io/instance: kubebrain
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/envoy/bootstrap.yaml
            - --disable-hot-restart
            - --drain-time-s
            - "5"
            - --drain-strategy
            - immediate
            - --log-level
            - info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - name: client
              containerPort: 2379
            - name: client-tls
              containerPort: 2380
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /server_info
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/bin/timeout
                  - "20"
                  - /bin/bash
                  - -ec
                  - >-
                    exec 3<>/dev/tcp/127.0.0.1/9901;
                    printf 'POST /healthcheck/fail HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&3;
                    IFS= read -r status <&3;
                    [[ "$status" == $'HTTP/1.1 200 OK\r' ]];
                    /bin/sleep 5;
                    exec 4<>/dev/tcp/127.0.0.1/9901;
                    printf 'POST /drain_listeners?graceful HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\nContent-Length: 0\r\n\r\n' >&4;
                    IFS= read -r drain_status <&4;
                    [[ "$drain_status" == $'HTTP/1.1 200 OK\r' ]];
                    /bin/sleep 5
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: kubebrain-envoy-bootstrap
            items:
              - key: bootstrap.yaml
                path: bootstrap.yaml
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-envoy-upstream
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: upstream-discovery
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kubebrain
    app.kubernetes.io/instance: kubebrain
  ports:
    - name: client
      port: 3379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-envoy
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
  ports:
    - name: client
      port: 2379
      targetPort: client
    - name: client-tls
      port: 2380
      targetPort: client-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubebrain-envoy-ingress
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-envoy
      app.kubernetes.io/instance: kubebrain
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              dbaas.kubebrain.io/client-access: "true"
      ports:
        - protocol: TCP
          port: 2379
        - protocol: TCP
          port: 2380
    - from:
        - namespaceSelector:
            matchLabels:
              dbaas.kubebrain.io/monitoring-access: "true"
      ports:
        - protocol: TCP
          port: 9901
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubebrain-envoy-egress
  labels:
    app.kubernetes.io/name: kubebrain-envoy
    app.kubernetes.io/instance: kubebrain
    app.kubernetes.io/component: client-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-envoy
      app.kubernetes.io/instance: kubebrain
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubebrain
              app.kubernetes.io/instance: kubebrain
      ports:
        - protocol: TCP
          port: 3379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
