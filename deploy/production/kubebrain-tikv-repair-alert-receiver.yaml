apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebrain-tikv-repair-alert-operation
  labels:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [dbaas.kubebrain.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [kubebrainoperations]
        scope: Namespaced
  matchConditions:
    - name: repair-alert-receiver
      expression: 'request.namespace == "kubebrain-repair-operations" && request.userInfo.username == "system:serviceaccount:kubebrain-repair-operations:kubebrain-tikv-repair-alert-receiver"'
  validations:
    - expression: 'object.metadata.name.matches("^tikv-repair-[a-f0-9]{16,20}$")'
      message: repair alert operation name must derive from an alert fingerprint
    - expression: 'object.spec.type == "TiKVTransactionRepair" && object.spec.operationID == object.metadata.name && object.spec.instance == "kubebrain" && object.spec.maxAttempts == 1'
      message: repair alert operations require the fixed type, identity, instance, and attempt limit
    - expression: 'has(object.spec.requestedBy) && object.spec.requestedBy == "alertmanager:transaction-path-policy"'
      message: repair alert operations require the fixed policy requester
    - expression: 'has(object.spec.parametersSecretRef) && object.spec.parametersSecretRef.name == object.metadata.name + "-parameters" && object.spec.parametersSecretRef.key == "parameters.json"'
      message: repair alert operations require their deterministic parameter Secret
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebrain-tikv-repair-alert-operation
  labels:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  policyName: kubebrain-tikv-repair-alert-operation
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubebrain-tikv-repair-alert-parameters
  labels:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: repair-alert-receiver
      expression: 'request.namespace == "kubebrain-repair-operations" && request.userInfo.username == "system:serviceaccount:kubebrain-repair-operations:kubebrain-tikv-repair-alert-receiver"'
  validations:
    - expression: 'object.metadata.name.matches("^tikv-repair-[a-f0-9]{16,20}-parameters$")'
      message: repair parameter Secret name must derive from an alert fingerprint
    - expression: 'has(object.immutable) && object.immutable == true && object.type == "Opaque"'
      message: repair parameter Secrets must be immutable Opaque Secrets
    - expression: 'has(object.data) && size(object.data) == 1 && "parameters.json" in object.data && (!has(object.stringData) || size(object.stringData) == 0)'
      message: repair parameter Secrets may only contain parameters.json data
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubebrain-tikv-repair-alert-parameters
  labels:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  policyName: kubebrain-tikv-repair-alert-parameters
  validationActions: [Deny]
---
apiVersion: v1
kind: Service
metadata:
  name: kubebrain-tikv-repair-alert-receiver
  namespace: kubebrain-repair-operations
  labels:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  selector:
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebrain-tikv-repair-alert-receiver
  namespace: kubebrain-repair-operations
  labels: &receiverLabels
    app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
    app.kubernetes.io/part-of: kubebrain
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
      app.kubernetes.io/part-of: kubebrain
  template:
    metadata:
      labels: *receiverLabels
    spec:
      serviceAccountName: kubebrain-tikv-repair-alert-receiver
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: *receiverLabels}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: *receiverLabels}}
      containers:
        - name: receiver
          image: kubebrain:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/kubebrain-tikv-repair-alert-receiver]
          args:
            - --listen-address=:8443
            - --tls-cert-file=/var/run/secrets/receiver-tls/tls.crt
            - --tls-key-file=/var/run/secrets/receiver-tls/tls.key
            - --bearer-token-file=/var/run/secrets/receiver-auth/token
            - --policy-executable=/opt/kubebrain/hack/production/request-tikv-transaction-repair.sh
            - --temp-dir=/tmp
            - --policy-timeout=30s
          env:
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: KUBECTL, value: /usr/local/bin/kubectl}
            - {name: OPERATIONCTL, value: /usr/local/bin/kubebrain-operationctl}
            - {name: KUBEBRAIN_NAMESPACE, value: kubebrain-system}
            - {name: KUBEBRAIN_STATEFULSET, value: kubebrain}
            - {name: TIDB_NAMESPACE, value: tidb-cluster}
            - {name: TIDB_CLUSTER, value: kb}
            - {name: OPERATION_NAMESPACE, value: kubebrain-repair-operations}
            - {name: ENDPOINT, value: "https://kubebrain-client.kubebrain-system.svc:3379"}
            - {name: MIN_FIRING_SECONDS, value: "120"}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /readyz, port: https}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /readyz, port: https}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /var/run/secrets/receiver-tls, readOnly: true}
            - {name: auth, mountPath: /var/run/secrets/receiver-auth, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: tls, secret: {secretName: kubebrain-tikv-repair-alert-receiver-tls, defaultMode: 0440}}
        - name: auth
          secret:
            secretName: kubebrain-tikv-repair-alert-receiver-auth
            defaultMode: 0440
            items:
              - {key: token, path: token}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubebrain-tikv-repair-alert-receiver
  namespace: kubebrain-repair-operations
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
      app.kubernetes.io/part-of: kubebrain
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubebrain-tikv-repair-alert-receiver
  namespace: kubebrain-repair-operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubebrain-tikv-repair-alert-receiver
      app.kubernetes.io/part-of: kubebrain
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - {protocol: TCP, port: 8443}
