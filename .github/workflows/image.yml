name: Build & Push DBaaS test image

on:
  push:
    branches: [dbaas]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dbaas-image-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dbaas'
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compute immutable image metadata
        id: vars
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-dbaas-${revision:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Go for security checks
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            hack/backup/objectstore/go.sum
            hack/kubectl/go.sum

      - name: Scan shipped Go modules
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd hack/backup/objectstore && \
            go mod download && go mod verify && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd hack/kubectl && \
            go mod download && go mod verify && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)

      - name: Build and scan kubectl binaries
        env:
          KUBEBRAIN_GIT_SHA: ${{ steps.vars.outputs.revision }}
          KUBEBRAIN_BUILD_DATE: ${{ steps.vars.outputs.created }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/kubectl-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifact_dir"
          for arch in amd64 arm64; do
            TARGETARCH="$arch" bash hack/kubectl/build.sh "$artifact_dir/kubectl-$arch"
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary "$artifact_dir/kubectl-$arch"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify automatic target architecture
        run: KUBEBRAIN_TEST_DOCKER_PLATFORM=true go test ./build -run '^TestDockerfileAutomaticTargetArchitecture$' -count=1 -v

      - name: Verify runtime manifest selection
        run: go test ./build -run '^TestImagePlatform' -count=1 -v

      - name: Verify isolated image preparation contracts
        run: |
          set -euo pipefail
          go test -race ./hack/production/internal/imageprepull ./hack/production/cmd/image-prepull -count=1 -timeout=5m
          go test ./build -run '^TestImagePrepull' -count=1 -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TiKV test image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            STORAGE=tikv
            KUBEBRAIN_VERSION=${{ steps.vars.outputs.version }}
            KUBEBRAIN_GIT_SHA=${{ steps.vars.outputs.revision }}
            KUBEBRAIN_BUILD_DATE=${{ steps.vars.outputs.created }}
          tags: ${{ steps.vars.outputs.image }}:dbaas-${{ steps.vars.outputs.revision }}
          # Export the multi-stage cache next to the image: GHA max-mode
          # export took 60 minutes in run 34290666105. Keep the old cache
          # read-only as a migration fallback, never as a release tag.
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.image }}:buildcache-dbaas
            type=gha,scope=kubebrain-dbaas
          cache-to: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache-dbaas,mode=max,oci-mediatypes=true,image-manifest=true
          provenance: mode=max
          sbom: true

      - name: Verify published test image
        run: |
          set -euo pipefail
          reference="${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          manifest="$RUNNER_TEMP/dbaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest.json"
          docker buildx imagetools inspect --raw "$reference" > "$manifest"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$manifest"
          amd64_digest="$(bash build/image-platform-digest.sh "$manifest" amd64)"
          arm64_digest="$(bash build/image-platform-digest.sh "$manifest" arm64)"
          # The index is public release metadata, not a credential. The shipped
          # non-root helper reads these exact bytes from a read-only bind mount.
          chmod 0444 "$manifest"
          amd64_reference="${{ steps.vars.outputs.image }}@$amd64_digest"
          docker pull --platform linux/amd64 "$amd64_reference"
          version_output="$(docker run --rm --platform linux/amd64 \
            --entrypoint /usr/local/bin/kube-brain "$amd64_reference" version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -F -- "Version:" | grep -F -- "${{ steps.vars.outputs.version }}"
          printf '%s\n' "$version_output" | grep -F -- "Storage:" | grep -F -- "TiKV"
          printf '%s\n' "$version_output" | grep -F -- "Git SHA:" | grep -F -- "${{ steps.vars.outputs.revision }}"
          printf '%s\n' "$version_output" | grep -F -- "BuildTime:" | grep -F -- "${{ steps.vars.outputs.created }}"
          labels_json="$(docker image inspect "$amd64_reference" --format '{{json .Config.Labels}}')"
          jq -e \
            --arg version "${{ steps.vars.outputs.version }}" \
            --arg revision "${{ steps.vars.outputs.revision }}" \
            --arg created "${{ steps.vars.outputs.created }}" \
            '.["org.opencontainers.image.version"] == $version and
             .["org.opencontainers.image.revision"] == $revision and
             .["org.opencontainers.image.created"] == $created' <<<"$labels_json"
          test "$(docker image inspect "$amd64_reference" --format '{{.Config.User}}')" = "65532:65532"
          kubectl_version="$(docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/kubectl "$amd64_reference" version --client -o json)"
          jq -e --arg revision "${{ steps.vars.outputs.revision }}" --arg created "${{ steps.vars.outputs.created }}" \
            '.clientVersion.gitVersion == "v1.36.4+kubebrain" and
             .clientVersion.goVersion == "go1.26.8" and
             .clientVersion.gitCommit == $revision and
             .clientVersion.buildDate == $created and
             .clientVersion.gitTreeState == "dirty"' <<<"$kubectl_version"

          # Compare the actual shipped bytes with the pre-publish scanned binaries.
          artifact_dir="$RUNNER_TEMP/kubectl-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=''
          trap 'if [[ -n "$container_id" ]]; then docker rm "$container_id"; fi' EXIT
          command -v readelf >/dev/null
          for arch in amd64 arm64; do
            platform_digest="$(bash build/image-platform-digest.sh "$manifest" "$arch")"
            platform_reference="${{ steps.vars.outputs.image }}@$platform_digest"
            docker pull --platform "linux/$arch" "$platform_reference"
            platform_version="$(docker run --rm --platform "linux/$arch" --entrypoint /usr/local/bin/kube-brain "$platform_reference" version)"
            printf '%s\n' "$platform_version" | grep -F 'Go OS/Arch:' | grep -F "linux/$arch"
            printf '%s\n' "$platform_version" | grep -F 'Git SHA:' | grep -F '${{ steps.vars.outputs.revision }}'
            prepull_identity="$(docker run --rm --platform "linux/$arch" --network=none --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --mount "type=bind,src=$manifest,dst=/release-index.json,readonly" \
              --entrypoint /usr/local/bin/kubebrain-image-prepull "$platform_reference" \
              --mode=verify-release --index-file=/release-index.json --image="$reference" \
              --amd64-digest="$amd64_digest" --arm64-digest="$arm64_digest")"
            jq -e --arg image "$reference" --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
              .image == $image and
              .runtimeDigests == {"linux/amd64":[$amd64,($image | split("@")[1])],
                                 "linux/arm64":[$arm64,($image | split("@")[1])]}
            ' <<<"$prepull_identity"
            container_id="$(docker create --platform "linux/$arch" --entrypoint /usr/local/bin/kubectl "$platform_reference" version --client)"
            docker cp "$container_id:/usr/local/bin" "$artifact_dir/shipped-bin-$arch"
            cmp "$artifact_dir/kubectl-$arch" "$artifact_dir/shipped-bin-$arch/kubectl"
            case "$arch" in
              amd64) machine=X86-64 ;;
              arm64) machine=AArch64 ;;
            esac
            go_binaries=0
            for binary in "$artifact_dir/shipped-bin-$arch/"*; do
              if build_info="$(go version -m "$binary" 2>/dev/null)"; then
                printf '%s\n' "$build_info" | grep -Fx $'\tbuild\tGOARCH='"$arch"
                readelf -h "$binary" | grep -E "Machine:.*${machine}"
                go_binaries=$((go_binaries + 1))
              fi
            done
            test "$go_binaries" -eq 67
            docker rm "$container_id"
            container_id=''
          done

      - name: Promote verified image to dbaas
        run: |
          set -euo pipefail
          reference="${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ steps.vars.outputs.image }}:dbaas" "$reference"
          test "$(docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image }}:dbaas" --format '{{json .Manifest}}' |
            jq -r '.digest')" = "${{ steps.build.outputs.digest }}"
          printf 'Verified DBaaS test image: `%s`\n\nCommit: `%s`\n' \
            "$reference" "${{ steps.vars.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare verified release evidence
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/dbaas-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$release_dir"
          cp "$RUNNER_TEMP/dbaas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manifest.json" "$release_dir/index.json"
          bash build/image-release-evidence.sh \
            "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}" \
            "$release_dir/index.json" "${{ steps.vars.outputs.revision }}" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$release_dir/release.json"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbaas-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dbaas-release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
