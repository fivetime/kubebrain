name: Integration

on:
  workflow_dispatch:
    inputs:
      k8s_node_image:
        description: kind node image for the integration cluster
        required: false
        default: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      replicas:
        description: KubeBrain replicas
        required: false
        default: "3"
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  CLUSTER_NAME: kubebrain-ci
  IMAGE_NAME: kubebrain:ci
  KIND_NODE_IMAGE: ${{ github.event.inputs.k8s_node_image || 'kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5' }}
  KUBEBRAIN_REPLICAS: ${{ github.event.inputs.replicas || '3' }}

jobs:
  real-consumer-smoke:
    name: Real consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            hack/etcd-client-compat/go.sum

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $RUNNER_TEMP/kind" |
            sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/kubectl" \
            "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          echo "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  $RUNNER_TEMP/kubectl" |
            sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install helm
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/helm.tar.gz" \
            https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  $RUNNER_TEMP/helm.tar.gz" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          helm version

      - name: Start KubeBrain + TiKV dev stack
        run: hack/dev/up.sh

      - name: Version info
        run: hack/dev/version-info.sh

      - name: Real consumer verification
        run: |
          sed -i '/^replace (/,$d' hack/etcd-client-compat/go.mod
          (cd hack/etcd-client-compat && go mod tidy)
          RUN_GO_TEST=false \
          RUN_BASIC_SMOKE=true \
          RUN_ETCD_CLIENT_COMPAT=true \
          RUN_TIKV_PERSISTENCE_SMOKE=true \
          RUN_K3S_DATASTORE_SMOKE=false \
          RUN_HA_SMOKE=true \
          RUN_APISERVER_SMOKE=true \
          RUN_INCLUSTER_APISERVER_SMOKE=true \
          RUN_TLS_SMOKE=false \
          RUN_LEASE_EXPIRY_SMOKE=true \
          RUN_WATCH_SOAK=true \
          RUN_COMPACT_SOAK=true \
          hack/dev/verify.sh

      - name: Dump cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n kubebrain-dev get all -o wide || true
          kubectl -n tidb-cluster get all -o wide || true
          kubectl -n kubebrain-dev logs deploy/kubebrain --tail=200 || true

      - name: Upload dev artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-dev-artifacts
          path: |
            .dev/**
          if-no-files-found: ignore

      - name: Tear down kind cluster
        if: always()
        run: hack/dev/down.sh
