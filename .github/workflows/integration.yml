name: Integration

on:
  workflow_dispatch:
    inputs:
      k8s_node_image:
        description: kind node image for the integration cluster
        required: false
        default: kindest/node:v1.36.1
      replicas:
        description: KubeBrain replicas
        required: false
        default: "3"
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  CLUSTER_NAME: kubebrain-ci
  IMAGE_NAME: kubebrain:ci
  KIND_NODE_IMAGE: ${{ github.event.inputs.k8s_node_image || 'kindest/node:v1.36.1' }}
  KUBEBRAIN_REPLICAS: ${{ github.event.inputs.replicas || '3' }}

jobs:
  real-consumer-smoke:
    name: Real consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            hack/etcd-client-compat/go.sum

      - name: Install kind
        run: |
          curl -fsSL -o /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Start KubeBrain + TiKV dev stack
        run: hack/dev/up.sh

      - name: Version info
        run: hack/dev/version-info.sh

      - name: Real consumer verification
        run: |
          sed -i '/^replace (/,$d' hack/etcd-client-compat/go.mod
          RUN_GO_TEST=false \
          RUN_BASIC_SMOKE=true \
          RUN_ETCD_CLIENT_COMPAT=true \
          RUN_TIKV_PERSISTENCE_SMOKE=true \
          RUN_K3S_DATASTORE_SMOKE=false \
          RUN_HA_SMOKE=true \
          RUN_APISERVER_SMOKE=true \
          RUN_INCLUSTER_APISERVER_SMOKE=true \
          RUN_TLS_SMOKE=false \
          RUN_LEASE_EXPIRY_SMOKE=true \
          RUN_WATCH_SOAK=true \
          RUN_COMPACT_SOAK=true \
          hack/dev/verify.sh

      - name: Dump cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n kubebrain-dev get all -o wide || true
          kubectl -n tidb-cluster get all -o wide || true
          kubectl -n kubebrain-dev logs deploy/kubebrain --tail=200 || true

      - name: Upload dev artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-dev-artifacts
          path: |
            .dev/**
          if-no-files-found: ignore

      - name: Tear down kind cluster
        if: always()
        run: hack/dev/down.sh
