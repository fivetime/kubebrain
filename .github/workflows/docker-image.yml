name: Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref_name }}
          fetch-depth: 0

      - name: Compute image tag
        id: vars
        run: |
          short_sha="$(git log -1 --pretty=%h)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TiKV image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            STORAGE=tikv
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.vars.outputs.image }}:latest
