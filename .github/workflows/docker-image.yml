name: Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA reachable from main; empty uses the triggering commit
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        env:
          REQUESTED_REVISION: ${{ github.event.inputs.source_ref || github.sha }}
        run: |
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$REQUESTED_REVISION"
          test "$(printf '%s' "$revision" | grep -Ec '^[0-9a-f]{40}$')" -eq 1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$revision" origin/main
          fi

      - name: Compute image tag
        id: vars
        run: |
          revision="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          version="$(git describe --tags --exact-match 2>/dev/null || printf '0.0.0-%s' "$short_sha")"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TiKV image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            STORAGE=tikv
            KUBEBRAIN_VERSION=${{ steps.vars.outputs.version }}
            KUBEBRAIN_GIT_SHA=${{ steps.vars.outputs.revision }}
            KUBEBRAIN_BUILD_DATE=${{ steps.vars.outputs.created }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform index
        run: |
          reference="${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect --raw "$reference" > "$RUNNER_TEMP/manifest.json"
          jq -e '
            [.manifests[].platform
              | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
              | .architecture] | sort == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/manifest.json"
          test "$(jq '[.manifests[] | select(.platform.os == "linux")] | length' \
            "$RUNNER_TEMP/manifest.json")" -eq 2
          docker buildx imagetools inspect "$reference"

      - name: Promote verified image to latest
        run: |
          reference="${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ steps.vars.outputs.image }}:latest" \
            "$reference"
          test "$(docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image }}:latest" --format '{{json .Manifest}}' |
            jq -r '.digest')" = "${{ steps.build.outputs.digest }}"
