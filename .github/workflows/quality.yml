name: Quality & Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0

  vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Race test critical packages
        run: |
          BACKEND_TESTS='Test(UpdateWithHugeClientRevisionDoesNotStallPipeline|DeleteWithHugeClientRevisionDoesNotStallPipeline|DeleteRangeCommitConflictDoesNotStallPipeline|UpdateMetadataReadFailureDoesNotStallPipeline|BroadcastEvictsSlowConsumerBeforeNextBatch|StreamDeliversGapFreePrefixToSlowConsumer|BackendWatchHistoryFallback|BackendWatchCatchUpAdvancesFromLastMatchingPrefixEvent|WatchEventOverflowResetsWatchState|CompactDoesNotRegressWatermark|ProcessEventsExitsOnCancelWhenConsumerStopped)$'
          go test -race ./pkg/backend -run "$BACKEND_TESTS"
          ETCD_TESTS='Test(StoreMaxUint64OnlyAdvances|MinSyncedRevisionReportsSlowestWatch|WatchProgressRequestReportsSyncedNotGlobalRevision|MaintenanceBasicDiagnostics|RangeCompactedRevisionMatchesEtcd|CompactFutureAndRepeatedRevisionMatchEtcd|CompactOlderRevisionReturnsCurrentHeader|CompactReturnsRetryableErrorWhenBackendCompactsBelowRequestedRevision|CancelCompactedWatchResponseUsesBackendCompactRevisionAndErrorReason|WatchEventToEtcdEventDistinguishesCreateAndUpdate|WatchEventToEtcdEventFallsBackToCreateWhenPrevKvUnavailable)$'
          go test -race ./pkg/server/etcd -run "$ETCD_TESTS"
          go test -race ./pkg/server/service/etcdproxy ./pkg/storage/tikv ./cmd/option
