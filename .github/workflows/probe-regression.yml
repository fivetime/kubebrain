name: Rollout probe regression

"on":
  push:
    branches: [dbaas]
    paths:
      - 'hack/production/cmd/rollout-availability-probe/**'
      - 'hack/production/cmd/pod-log-capture/**'
      - 'hack/production/internal/**'
      - 'hack/scale-lab/**'
      - 'hack/etcd-client-compat/**'
      - 'hack/dev/create-apiserver-test-pki.sh'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'build/workflow_test.go'
      - '.github/workflows/probe-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-regression-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  probe-tests:
    if: github.ref == 'refs/heads/dbaas'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - name: Verify workflow contracts and probe code
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go test -race -count=1 ./build
          go vet ./hack/production/cmd/rollout-availability-probe
      - name: Check out pinned etcd reference for harness compilation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: etcd-io/etcd
          ref: 5cd9f4ee13801e18825d661e5005ae599460bc3a
          path: .ci-reference-etcd
          persist-credentials: false
      - name: Verify isolated control-plane harness contracts
        run: |
          set -euo pipefail
          command -v bash jq openssl
          test "$(git -C .ci-reference-etcd rev-parse HEAD)" = 5cd9f4ee13801e18825d661e5005ae599460bc3a
          cd hack/etcd-client-compat
          # All five source replacements are bound to the pinned checkout.
          for module in api cache client/pkg client/v3 server; do
            module_path="go.etcd.io/etcd/$module"
            if [[ "$module" != client/v3 ]]; then module_path+=/v3; fi
            go mod edit "-replace=$module_path=$GITHUB_WORKSPACE/.ci-reference-etcd/$module"
          done
          go mod tidy
          go mod verify
          go test -race -count=1 -timeout=3m -v . -run '^Test(ControlPlane|Ephemeral.*PKI)'
      - name: Verify etcd service and Watch regressions
        run: |
          set -euo pipefail
          go vet ./pkg/server/etcd
          go test -count=1 -timeout=10m -v ./pkg/server/etcd
          go test -race -count=1 -timeout=8m -v ./pkg/server/etcd -run '(Auth|JWT|PutPathsRejectGuardChangedAtCommit)'
          go test -race -count=1 -timeout=8m -v ./pkg/server/etcd -run '(Lease|Revoke|Expiry|Checkpoint|Attachment)'
          go test -race -count=1 -timeout=8m -v ./pkg/server/etcd -run '(ReadBarrier|Watch|Prev[Kk][Vv]|PrevHint|RevKeyCache|CachePromotion|MetadataSingleflight)'
      - name: Verify follower proxy regressions
        run: |
          set -euo pipefail
          go vet ./pkg/server/service/etcdproxy
          go test -race -count=1 -timeout=5m -v ./pkg/server/service/etcdproxy
      - name: Verify revision read barriers
        run: |
          set -euo pipefail
          go vet ./pkg/server/service/revision
          go test -race -count=1 -timeout=3m -v ./pkg/server/service/revision
      - name: Verify read-only pod log capture
        run: |
          set -euo pipefail
          go vet ./hack/production/cmd/pod-log-capture
          go test -race -count=1 -timeout=2m -v ./hack/production/cmd/pod-log-capture
      - name: Race test all probe regressions
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=20m -v ./hack/production/cmd/rollout-availability-probe
