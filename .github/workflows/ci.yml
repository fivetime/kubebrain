name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  ETCD_COMPAT_GO_VERSION: "1.26.x"

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './.git/*' -not -path './pkg/metrics/mock/mock_metrics.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Check shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          test "${#shell_files[@]}" -gt 0
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            --severity=warning "${shell_files[@]}"

      - name: Build all packages
        run: go build ./...

      - name: Vet packages
        run: go vet ./...

      - name: Test all packages
        run: go test ./...

      - name: Scan reachable Go vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd hack/backup/objectstore && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd hack/etcd-client-compat && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd hack/scale-lab/bigstream && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd hack/scale-lab/loadgen && \
            go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)

      - name: Run static analysis
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd hack/backup/objectstore && \
            go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)

      - name: Race test critical packages
        run: |
          BACKEND_RACE_TESTS='Test(UpdateWithHugeClientRevisionDoesNotStallPipeline|DeleteWithHugeClientRevisionDoesNotStallPipeline|DeleteRangeCommitConflictDoesNotStallPipeline|UpdateMetadataReadFailureDoesNotStallPipeline|BroadcastEvictsSlowConsumerBeforeNextBatch|StreamDeliversGapFreePrefixToSlowConsumer|BackendWatchHistoryFallback|BackendWatchCatchUpAdvancesFromLastMatchingPrefixEvent|WatchEventOverflowResetsWatchState|CompactDoesNotRegressWatermark|ProcessEventsExitsOnCancelWhenConsumerStopped)$'
          go test -race ./pkg/backend -run "$BACKEND_RACE_TESTS"
          SERVER_ETCD_RACE_TESTS='Test(StoreMaxUint64OnlyAdvances|MinSyncedRevisionReportsSlowestWatch|WatchProgressRequestReportsSyncedNotGlobalRevision|MaintenanceBasicDiagnostics|RangeCompactedRevisionMatchesEtcd|CompactFutureAndRepeatedRevisionMatchEtcd|CompactOlderRevisionReturnsCurrentHeader|CompactReturnsRetryableErrorWhenBackendCompactsBelowRequestedRevision|CancelCompactedWatchResponseUsesBackendCompactRevisionAndErrorReason|WatchEventToEtcdEventDistinguishesCreateAndUpdate|WatchEventToEtcdEventFallsBackToCreateWhenPrevKvUnavailable)$'
          go test -race ./pkg/server/etcd -run "$SERVER_ETCD_RACE_TESTS"
          go test -race ./pkg/server/service/etcdproxy ./pkg/storage/tikv ./cmd/option

  build:
    name: Build binaries and images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build TiKV binary
        run: make tikv

      - name: Build Badger binary
        run: make badger

      - name: Compute image metadata
        id: image
        run: |
          echo "version=ci-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build TiKV Docker image
        run: |
          docker build \
            --build-arg TARGETARCH=amd64 \
            --build-arg STORAGE=tikv \
            --build-arg KUBEBRAIN_VERSION="${{ steps.image.outputs.version }}" \
            --build-arg KUBEBRAIN_GIT_SHA="${{ steps.image.outputs.revision }}" \
            --build-arg KUBEBRAIN_BUILD_DATE="${{ steps.image.outputs.created }}" \
            -t kubebrain:ci-tikv .
          test "$(docker image inspect kubebrain:ci-tikv \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" \
            = "${{ steps.image.outputs.revision }}"
          test "$(docker image inspect kubebrain:ci-tikv --format '{{ .Config.User }}')" \
            = "65532:65532"
          test "$(docker run --rm --entrypoint kubectl kubebrain:ci-tikv \
            version --client -o json | jq -r .clientVersion.gitVersion)" = "v1.36.2"

      - name: Build Badger Docker image
        run: |
          docker build \
            --build-arg TARGETARCH=amd64 \
            --build-arg STORAGE=badger \
            --build-arg KUBEBRAIN_VERSION="${{ steps.image.outputs.version }}" \
            --build-arg KUBEBRAIN_GIT_SHA="${{ steps.image.outputs.revision }}" \
            --build-arg KUBEBRAIN_BUILD_DATE="${{ steps.image.outputs.created }}" \
            -t kubebrain:ci-badger .
          test "$(docker image inspect kubebrain:ci-badger \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" \
            = "${{ steps.image.outputs.revision }}"

  etcd-client-compat-compile:
    name: etcd client compat compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.ETCD_COMPAT_GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            hack/etcd-client-compat/go.sum

      - name: Compile official etcd client compatibility tests
        working-directory: hack/etcd-client-compat
        run: |
          sed -i '/^replace (/,$d' go.mod
          go mod tidy
          go vet ./...
          go test -run '^$' ./...
