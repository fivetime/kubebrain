name: Backend protocol integration

on:
  push:
    branches: [dbaas]
    paths:
      - 'pkg/backend/**'
      - 'pkg/storage/**'
      - 'pkg/metrics/**'
      - 'go.mod'
      - 'go.sum'
      - 'hack/backend-integration/**'
      - '.github/workflows/backend-integration.yml'
  pull_request:
    branches: [dbaas]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onepc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            hack/backend-integration/go.sum
      - name: Validate mock entry and cleanup
        shell: bash
        run: |
          set -euo pipefail
          bash -n hack/backend-integration/run-onepc.sh
          bash hack/backend-integration/run-onepc-entry-test.sh
          bash hack/backend-integration/run-onepc-cleanup-test.sh
          test -z "$(gofmt -l hack/backend-integration/backend_onepc_test.go)"
      - name: Backend outcomes and watch batches
        shell: bash
        run: |
          set -euo pipefail
          bash hack/backend-integration/run-onepc.sh --count 10
          bash hack/backend-integration/run-onepc.sh --race --count 3
          git diff --exit-code
