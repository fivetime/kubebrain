version: "2"

run:
  timeout: 10m
  go: "1.26"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubewharf/kubebrain
  exclusions:
    paths:
      - pkg/metrics/mock/mock_metrics.go

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -QF1001
        - -QF1004
        - -QF1008
        - -S1001
        - -S1002
        - -S1004
        - -S1009
        - -S1019
        - -S1023
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - text: "Error return value of .*`.*\\.(Close|EmitCounter|EmitGauge|EmitHistogram|Rollback)`.* is not checked"
        linters:
          - errcheck
